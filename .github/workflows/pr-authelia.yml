name: pr-authelia

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-authelia-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  authelia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'services/authelia/**'
              - 'compose/Caddyfile.tmpl'
              - 'compose/docker-compose.yml.tmpl'
              - '.github/workflows/pr-authelia.yml'

      - id: should-run
        name: determine if suite should run
        run: |
          set -e
          if [[ "${{ github.head_ref }}" == release-please--* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release-please PR — running full authelia suite"
          else
            echo "run=${{ steps.changed.outputs.src }}" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.should-run.outputs.run != 'true'
        run: echo "no authelia changes; skipping all steps"

      - if: steps.should-run.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: services/authelia/.python-version
          cache: pip

      - name: install uv
        if: steps.should-run.outputs.run == 'true'
        run: pip install uv

      - name: deps
        if: steps.should-run.outputs.run == 'true'
        working-directory: services/authelia
        run: uv sync --frozen

      - name: docker buildx setup
        if: steps.should-run.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: image build (no push)
        if: steps.should-run.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/authelia
          platforms: linux/amd64
          push: false
          load: true
          tags: lab-bridge-authelia:pr-${{ github.event.pull_request.number }}

      - name: pytest (e2e)
        if: steps.should-run.outputs.run == 'true'
        working-directory: services/authelia
        env:
          AUTHELIA_TEST_IMAGE: lab-bridge-authelia:pr-${{ github.event.pull_request.number }}
        run: uv run pytest tests/e2e/ -v
