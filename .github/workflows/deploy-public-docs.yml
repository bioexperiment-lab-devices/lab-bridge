name: deploy-public-docs

on:
  push:
    branches: [main]
    paths:
      - 'public_docs/**'

concurrency:
  group: deploy-public-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-docs:
    name: rsync public_docs to VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: rsync public_docs to VPS and restart siteapp
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
        run: |
          # Mirror public_docs/ to /srv/lab-bridge/siteapp/docs/ on the VPS.
          # That path must match config.yaml's vps.remote_root + /siteapp/docs/,
          # which is what compose mounts read-only at /srv/docs inside the
          # siteapp container. Markdown content is re-read per request, but
          # _nav.yaml is loaded once at module import (build_nav() in
          # services/siteapp/app/main.py, per PR #128). A bare rsync would
          # leave the in-memory sidebar pointing at the old manifest, so we
          # restart siteapp after rsync to force build_nav() to re-run.
          ssh -o StrictHostKeyChecking=accept-new "$VPS_SSH_USER@$VPS_HOST" \
            "mkdir -p /srv/lab-bridge/siteapp/docs"
          rsync -az --delete -v \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            public_docs/ \
            "$VPS_SSH_USER@$VPS_HOST:/srv/lab-bridge/siteapp/docs/"
          ssh -o StrictHostKeyChecking=accept-new "$VPS_SSH_USER@$VPS_HOST" \
            "sudo -n docker restart lab-bridge-siteapp-1"
