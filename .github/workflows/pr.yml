name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Semantic Pull Request
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^.+$

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # Detect which file groups changed in this PR so we can skip steps
      # whose inputs didn't change. Each filter activates the steps it gates.
      # A docs-only PR (e.g. README, CLAUDE.md) leaves all filters false and
      # the verify job passes in seconds — the required-check is still
      # satisfied because the job ran.
      - name: detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shell:
              - 'scripts/**/*.sh'
            bats:
              - 'scripts/**'
              - 'tests/**'
              - 'compose/**'
              - 'config.example.yaml'
              - 'Taskfile.yml'
            siteapp:
              - 'compose/siteapp/**'
            flasher:
              - 'compose/flasher/**'
            workflow:
              - '.github/workflows/pr.yml'

      - name: shellcheck
        if: steps.changes.outputs.shell == 'true' || steps.changes.outputs.workflow == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x --severity=warning scripts/*.sh scripts/lib/*.sh

      - name: install Task
        if: steps.changes.outputs.bats == 'true' || steps.changes.outputs.workflow == 'true'
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install yq v4
        if: steps.changes.outputs.bats == 'true' || steps.changes.outputs.workflow == 'true'
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: install bats
        if: steps.changes.outputs.bats == 'true' || steps.changes.outputs.workflow == 'true'
        uses: bats-core/bats-action@3.0.1

      - name: bats
        if: steps.changes.outputs.bats == 'true' || steps.changes.outputs.workflow == 'true'
        # 30 min, not 20: typical run is ~17.5 min after we added the flasher
        # image build into both test_deploy.bats and test_ops.bats setup_file.
        # One slow Docker pull on a CI runner pushes wall-clock past 20 min.
        timeout-minutes: 30
        # Skip all 4 test_siteapp_*.bats files in CI: each does an identical
        # full fake-VPS deploy in setup_file (~7min). 4 × 7 doesn't fit in any
        # reasonable CI step budget. The deploy chain is already exercised by
        # test_deploy.bats (rsync + compose up to the fake-VPS); the siteapp_*
        # files verify routing/auth/upload/safety policies specifically and
        # require siteapp running. They still pass locally with `bats tests/`.
        # Follow-up: consolidate the four into one .bats with a single shared
        # setup_file so CI can run them under one ~10-12min budget.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          for f in tests/*.bats; do
              case "$(basename "$f")" in
                  test_siteapp_*.bats)
                      echo "::notice::skipping $f in CI (run locally: bats tests/$(basename "$f"))"
                      continue
                      ;;
              esac
              files+=("$f")
          done
          bats "${files[@]}"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.siteapp == 'true' || steps.changes.outputs.workflow == 'true'
        with:
          python-version-file: compose/siteapp/.python-version
          cache: pip

      - name: install uv
        if: steps.changes.outputs.siteapp == 'true' || steps.changes.outputs.workflow == 'true'
        run: pip install uv

      - name: siteapp deps
        if: steps.changes.outputs.siteapp == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: compose/siteapp
        run: uv sync --frozen

      - name: ruff check
        if: steps.changes.outputs.siteapp == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: compose/siteapp
        run: uv run ruff check app tests

      - name: ruff format check
        if: steps.changes.outputs.siteapp == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: compose/siteapp
        run: uv run ruff format --check app tests

      - name: pytest
        if: steps.changes.outputs.siteapp == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: compose/siteapp
        run: uv run pytest -v

      - name: docker buildx setup
        if: steps.changes.outputs.siteapp == 'true' || steps.changes.outputs.workflow == 'true'
        uses: docker/setup-buildx-action@v3

      - name: siteapp image build (no push)
        if: steps.changes.outputs.siteapp == 'true' || steps.changes.outputs.workflow == 'true'
        uses: docker/build-push-action@v6
        with:
          context: compose/siteapp
          platforms: linux/amd64
          push: false
          load: true
          tags: lab-bridge-siteapp:pr-${{ github.event.pull_request.number }}

      # Flasher service: same shape as siteapp's steps, gated on the
      # flasher filter. setup-python / install uv / docker buildx setup
      # are re-used from the siteapp steps when both filters are active;
      # the if: conditions below cover the case where flasher changed but
      # siteapp didn't.
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.flasher == 'true' && steps.changes.outputs.siteapp != 'true' && steps.changes.outputs.workflow != 'true'
        with:
          python-version-file: compose/flasher/.python-version
          cache: pip

      - name: install uv (flasher)
        if: steps.changes.outputs.flasher == 'true' && steps.changes.outputs.siteapp != 'true' && steps.changes.outputs.workflow != 'true'
        run: pip install uv

      - name: flasher deps
        if: steps.changes.outputs.flasher == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: compose/flasher
        run: uv sync --frozen

      - name: flasher ruff check
        if: steps.changes.outputs.flasher == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: compose/flasher
        run: uv run ruff check app tests

      - name: flasher ruff format check
        if: steps.changes.outputs.flasher == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: compose/flasher
        run: uv run ruff format --check app tests

      - name: flasher pytest
        if: steps.changes.outputs.flasher == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: compose/flasher
        run: uv run pytest -v

      - name: setup Node
        if: steps.changes.outputs.flasher == 'true' || steps.changes.outputs.workflow == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: compose/flasher/web/package-lock.json

      - name: flasher SPA install
        if: steps.changes.outputs.flasher == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: compose/flasher/web
        run: npm ci --no-audit --no-fund

      - name: flasher SPA type-check
        if: steps.changes.outputs.flasher == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: compose/flasher/web
        run: npx tsc --noEmit

      - name: flasher SPA build
        if: steps.changes.outputs.flasher == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: compose/flasher/web
        run: npm run build

      - name: docker buildx setup (flasher)
        if: steps.changes.outputs.flasher == 'true' && steps.changes.outputs.siteapp != 'true' && steps.changes.outputs.workflow != 'true'
        uses: docker/setup-buildx-action@v3

      - name: flasher image build (no push)
        if: steps.changes.outputs.flasher == 'true' || steps.changes.outputs.workflow == 'true'
        uses: docker/build-push-action@v6
        with:
          context: compose/flasher
          platforms: linux/amd64
          push: false
          load: true
          tags: lab-bridge-flasher:pr-${{ github.event.pull_request.number }}
