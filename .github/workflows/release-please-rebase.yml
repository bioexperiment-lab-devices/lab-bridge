name: release-please-rebase

# When one component's release-please PR merges, its sibling release-please
# PRs are left with a stale .release-please-manifest.json — every component
# shares that one file, and release-please-action does NOT auto-rebase the
# open siblings ("PR #X remained the same" in the logs). The PR then sits
# unmergeable until a human resolves the conflict by hand.
#
# This workflow fires after every successful release-please run, finds the
# still-open sibling release PRs, and replays each one's commit on top of
# current main (git rebase). The expected manifest conflict — where the PR
# wants to set its own path's version but main has bumped a sibling path
# since — is auto-resolved by writing (main's current manifest) with only
# THIS PR's own path overridden.
#
# We force-push because the rebase rewrites history. Branch protection on
# main isn't affected — we only push to the release-please branches.

on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]

concurrency:
  group: release-please-rebase-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    # Only chain off real push-triggered release-please runs that actually
    # succeeded. Manual rollback dispatches and failed runs are out of scope.
    if: |
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: rewrite manifest on each open sibling release-please branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          MAIN_MANIFEST=$(cat .release-please-manifest.json)
          git config user.name  "lab-bridge release-please bot"
          git config user.email "release-please-bot@users.noreply.github.com"

          mapfile -t prs < <(
            gh pr list --state open --json number,headRefName \
              | jq -c '.[] | select(.headRefName | startswith("release-please--branches--main--components--"))'
          )

          if [[ ${#prs[@]} -eq 0 ]]; then
            echo "no open release-please PRs — nothing to rebase"
            exit 0
          fi

          for pr in "${prs[@]}"; do
            num=$(jq -r .number      <<<"$pr")
            ref=$(jq -r .headRefName <<<"$pr")
            pkg=${ref##*--}
            path=$(jq -r --arg pkg "$pkg" \
              '.packages | to_entries[] | select(.value["package-name"] == $pkg) | .key' \
              release-please-config.json)

            if [[ -z "$path" || "$path" == "null" ]]; then
              echo "::warning::skipping $ref — no package matching '$pkg' in release-please-config.json"
              continue
            fi

            echo "=== considering $ref (PR #$num, path=$path) ==="

            git fetch origin "refs/heads/$ref:refs/heads/$ref"
            git checkout "$ref"

            own=$(jq -r --arg p "$path" '.[$p]' .release-please-manifest.json)
            if [[ -z "$own" || "$own" == "null" ]]; then
              echo "::warning::skipping $ref — branch manifest has no value for path '$path'"
              git checkout main
              continue
            fi

            # Real rebase onto main. Just rewriting the manifest on top of the
            # stale branch isn't enough — git's 3-way merge sees an adjacent-
            # line conflict between main's sibling-path bump and the PR's own-
            # path bump because the merge-base still predates the sibling
            # merge. Replaying the PR's commit on top of current main advances
            # the merge-base and produces a clean diff.
            if git rebase main; then
              echo "$ref: clean rebase"
            else
              # Expected: manifest conflict where the PR's sibling-path values
              # are stale relative to main. Resolve by taking main's manifest
              # and keeping only this PR's own-path bump.
              if [[ ! -f .release-please-manifest.json ]] \
                  || ! grep -q '^<<<<<<<' .release-please-manifest.json; then
                echo "::error::$ref: rebase failed with a non-manifest conflict — aborting"
                git rebase --abort
                continue
              fi
              jq --arg p "$path" --arg v "$own" '.[$p] = $v' <<<"$MAIN_MANIFEST" \
                > .release-please-manifest.json
              git add .release-please-manifest.json
              if ! GIT_EDITOR=true git rebase --continue; then
                echo "::error::$ref: rebase --continue failed after resolving manifest — aborting"
                git rebase --abort || true
                continue
              fi
              echo "$ref: rebased with manifest auto-resolution"
            fi

            # Rebase rewrote history; force-with-lease is safe because we just
            # fetched the branch and nothing else should be pushing to it
            # (release-please-action only reads it via "PR remained the same").
            if git push --force-with-lease origin "HEAD:refs/heads/$ref"; then
              echo "pushed rebased $ref"
            else
              echo "::warning::push to $ref failed — likely raced with another push; next release-please run will re-attempt"
            fi
            git checkout main
          done
