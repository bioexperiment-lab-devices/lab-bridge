name: pr-platform

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-platform-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.should-run.outputs.heavy }}
      any: ${{ steps.should-run.outputs.any }}
      shell: ${{ steps.changed.outputs.shell }}
    steps:
      - uses: actions/checkout@v4

      - id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # dorny/paths-filter@v3 combines a rule's patterns with `some()`
            # semantics (predicateQuantifier defaults to "some") — there is NO
            # ordered last-match-wins and no negation-as-exclusion. A bare
            # '!compose/images.yaml' entry is NOT an exclusion of
            # 'compose/**': it is an independent matcher that is true for
            # every path that is not compose/images.yaml, i.e. a catch-all
            # that matches README.md, services/**, etc. Do not "simplify"
            # this back to the two-entry form — use the extglob below, which
            # matches every compose/** file except images.yaml in one
            # pattern. (Do not shrink it to 'compose/!(images.yaml)' either —
            # that doesn't cross '/', so it would drop compose/grafana/**
            # and compose/loki/** from the heavy gate.)
            heavy:
              - 'compose/**/!(images.yaml)'
              - 'scripts/**'
              - 'tests/integration/**'
              - 'config.example.yaml'
              - 'Taskfile.yml'
              - '.github/workflows/pr-platform.yml'
            images:
              - 'compose/images.yaml'
            shell:
              - 'scripts/**/*.sh'

      - id: should-run
        name: determine which suites should run
        run: |
          set -e
          heavy="${{ steps.changed.outputs.heavy }}"
          images="${{ steps.changed.outputs.images }}"
          if [[ "${{ github.head_ref }}" == release-please--* ]]; then
            heavy=true
            echo "::notice::release-please PR — running full platform suite"
          fi
          any=false
          if [[ "$heavy" == "true" || "$images" == "true" ]]; then
            any=true
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "any=$any"     >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy any=$any"

  shellcheck:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x --severity=warning scripts/*.sh scripts/lib/*.sh

  bats-cheap:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: bats (cheap)
    steps:
      - uses: actions/checkout@v4
      - name: install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install yq v4
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: install bats
        uses: bats-core/bats-action@3.0.1
      - name: bats cheap
        run: |
          bats tests/integration/test_common.bats \
               tests/integration/test_config.bats \
               tests/integration/test_crypto.bats \
               tests/integration/test_render.bats \
               tests/integration/test_secrets.bats \
               tests/integration/test_grafana_provisioning.bats \
               tests/integration/test_deploy_stack_only.bats \
               tests/integration/test_service_selection_render.bats \
               tests/integration/test_images_cli.bats

  bats-heavy:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    # Each cell brings up the fake VPS (compose pull + render + bringup) before
    # its bats file runs. On the slowest GitHub runner allocations the `ops`
    # cell has been observed near 15 min — and it tripped a 25-min cap after
    # the studio image joined the preload set (PR #167: all tests green, job
    # canceled in teardown at 25m18s). Keep headroom so a slow runner doesn't
    # flake the gate. A genuinely stuck step will still trip the limit cleanly.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # profile (LDS_SUITE_PROFILE) picks how much of the stack
          # preload_fake_vps_images/compose_images_available bring up — see
          # the CONTRACT note above _profile_images in
          # tests/integration/helpers.bash. `core` trims the PRELOAD set and
          # the skip-guard's image coverage ONLY — it does NOT by itself stop
          # deploy.sh from bringing jupyter/studio/monitoring up. A cell is
          # only safe at `core` if its suite also satisfies one of:
          #   (a) it brings the stack up via fake_vps_up_with_users(), which
          #       applies its own disabled_services override for this
          #       profile — `auth` is the only cell that calls this helper,
          #       and it still needs `full` (see below), so no cell uses
          #       `core` via path (a) today;
          #   (b) it sets disabled_services itself in its own inline
          #       bring-up — `service-selection` (it already disables
          #       jupyter/monitoring/studio/streamer/flasher, so trimming
          #       preload to caddy/chisel/authelia matches what's actually
          #       deployed);
          #   (c) it never deploys the stack at all — `provision` (its
          #       setup_file only exercises provision.sh, never deploy.sh).
          # deploy/ops/routes-smoke/metrics-smoke/navbar wire bring-up inline
          # WITHOUT touching disabled_services and each assert something
          # about jupyter, studio, or the monitoring group, so they MUST stay
          # `full`: `core` would still let deploy.sh bring those services up
          # unpreloaded and unguarded, trading a graceful rate-limit skip for
          # a hard mid-deploy pull failure. `auth` satisfies path (a) above
          # but still needs `full`: it exercises the forward_auth gate on
          # /jupyter/ and /grafana/, and those routes are deleted outright by
          # render_caddyfile's svc:jupyter/svc:monitoring block-stripping
          # when the service is disabled — a `core` auth cell would fail
          # hard, not just skip less.
          - suite: deploy
            files: tests/integration/test_deploy.bats
            profile: full
          - suite: ops
            files: tests/integration/test_ops.bats
            profile: full
          - suite: provision
            files: tests/integration/test_provision.bats
            profile: core
          - suite: routes-smoke
            files: tests/integration/test_routes_smoke.bats
            profile: full
          - suite: metrics-smoke
            files: tests/integration/test_metrics_smoke.bats
            profile: full
          - suite: navbar
            files: tests/integration/test_navbar_smoke.bats
            profile: full
          - suite: auth
            files: tests/integration/test_auth_smoke.bats
            profile: full
          - suite: service-selection
            files: tests/integration/test_service_selection.bats
            profile: core
    name: bats (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4

      # Every remaining cell builds 4 local service images and side-loads
      # them — plus the multi-GB scipy-notebook image — into the fake-VPS
      # DinD. GitHub-hosted ubuntu-latest runners ship with ~14 GB free,
      # which has been observed to run out (e.g. PR #105 hit "no space left
      # on device" during scipy-notebook layer extraction). Reclaim ~20 GB
      # by removing pre-installed SDKs we never use.
      - name: free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install yq v4
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: install bats
        uses: bats-core/bats-action@3.0.1

      - name: bats ${{ matrix.suite }}
        env:
          LDS_SUITE_PROFILE: ${{ matrix.profile }}
        run: bats ${{ matrix.files }}

  # Aggregator: the single required check for branch protection. Succeeds
  # when changes ran and every dependent job either passed or was skipped
  # (e.g., docs-only PRs where changes.outputs.any=='false', or image-only
  # PRs where heavy=='false' but any=='true' so only bats-cheap runs).
  platform:
    needs: [changes, shellcheck, bats-cheap, bats-heavy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate
        run: |
          set -e
          changes="${{ needs.changes.result }}"
          shellcheck="${{ needs.shellcheck.result }}"
          cheap="${{ needs.bats-cheap.result }}"
          heavy="${{ needs.bats-heavy.result }}"
          echo "changes:    $changes"
          echo "shellcheck: $shellcheck"
          echo "bats-cheap: $cheap"
          echo "bats-heavy: $heavy"
          if [[ "$changes" != "success" ]]; then
            echo "::error::changes job did not succeed: $changes"
            exit 1
          fi
          for r in "$shellcheck" "$cheap" "$heavy"; do
            case "$r" in
              success|skipped) ;;
              *)
                echo "::error::dependent job failed: $r"
                exit 1
                ;;
            esac
          done
          echo "platform: all required checks pass"
