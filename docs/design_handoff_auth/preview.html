<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auth UI surfaces — preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style id="auth-css">
/* ============================================================
   Auth / Navbar / Errors / Dialogs CSS
   Extracted from Lab Bridge.html (SerialHop UI design canvas).
   ============================================================ */


/* ============================================================
   Lab Bridge — design tokens & primitives
   Builds on SerialHop / Flasher's token set; adds .lb-* prefix
   for lab-bridge-specific surfaces (navbar rail, home cards, etc.)
   ============================================================ */
:root {
  --bg-page: #ECE9E0;
  --bg-window-outer: #2A2823;

  --surface: #FFFFFF;
  --surface-sunken: #F8F6F0;
  --surface-strip: #FAF8F3;
  --surface-rail: #F3F0E6;

  --border: #E2DED2;
  --border-strong: #C8C3B5;
  --border-input: #C3BFB2;

  --text: #1A1916;
  --text-secondary: #514E47;
  --text-muted: #8A8678;
  --text-inverse: #FAF8F3;

  --accent: #1F3A8A;
  --accent-hover: #182E6F;
  --accent-soft: #E7ECF6;
  --accent-border: #B8C2DC;

  --success: #2F7D3F;
  --success-soft: #E5F1E6;
  --success-border: #BCD7BE;

  --danger: #B23A2A;
  --danger-soft: #F8E5E0;
  --danger-border: #ECC5BC;

  --warning: #A37200;
  --warning-soft: #F5EAC8;
  --warning-border: #E2D096;

  --neutral-dot: #9F9B8E;
  --shadow-card: 0 1px 0 rgba(26,25,22,0.04), 0 1px 2px rgba(26,25,22,0.06);
  --shadow-popover: 0 10px 24px -8px rgba(26,25,22,0.25), 0 2px 6px rgba(26,25,22,0.08);
  --shadow-overlay: 0 24px 50px -20px rgba(26,25,22,0.45), 0 8px 18px -6px rgba(26,25,22,0.18);
}

[data-theme="dark"] {
  --bg-page: #1B1A17;
  --bg-window-outer: #0E0D0B;
  --surface: #232220;
  --surface-sunken: #1D1C19;
  --surface-strip: #1F1E1B;
  --surface-rail: #1E1D1A;
  --border: #34322D;
  --border-strong: #4A4740;
  --border-input: #4A4740;
  --text: #F0EDE3;
  --text-secondary: #B8B3A4;
  --text-muted: #7E7A6E;
  --text-inverse: #1A1916;
  /* Accent brightened for AA contrast on accent-soft + surface bgs in dark */
  --accent: #BCCBF2;
  --accent-hover: #DBE3F8;
  --accent-soft: #2A3257;
  --accent-border: #4A5587;
  --success: #7CC18A;
  --success-soft: #1F2C22;
  --success-border: #335A3E;
  --danger: #E58879;
  --danger-soft: #34211D;
  --danger-border: #6A3D34;
  --warning: #E3C067;
  --warning-soft: #2F2715;
  --warning-border: #5E4C20;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg-page);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ============================================================
   Browser window chrome — matches Flasher's FlBrowser idiom
   ============================================================ */
.lb-window {
  width: 1280px;
  height: 820px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  color: var(--text);
  position: relative;
  box-shadow: 0 1px 0 rgba(26,25,22,0.04), 0 4px 12px -2px rgba(26,25,22,0.08);
}
.lb-chrome {
  height: 38px;
  background: var(--surface-sunken);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 12px;
  flex: 0 0 auto;
  user-select: none;
}
.lb-traffic { display: flex; gap: 6px; }
.lb-traffic i {
  width: 11px; height: 11px;
  border-radius: 50%;
  display: block;
}
.lb-traffic i:nth-child(1) { background: #E5594D; }
.lb-traffic i:nth-child(2) { background: #DFA64F; }
.lb-traffic i:nth-child(3) { background: #54BD4A; }

.lb-addr {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  height: 24px;
  padding: 0 10px;
  max-width: 480px;
  margin: 0 auto;
}
.lb-addr__lock { color: var(--text-muted); font-size: 10px; }
.lb-addr__path { color: var(--text); }
.lb-muted { color: var(--text-muted); }

.lb-body {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;
  overflow: hidden;
  background: var(--bg-page);
}

/* ============================================================
   Platform navbar — side rail (persistent mode)
   ============================================================ */
.lb-rail {
  flex: 0 0 auto;
  background: var(--surface-rail);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  width: var(--rail-w, 56px);
  transition: width 200ms cubic-bezier(.2,.7,.3,1);
  position: relative;
  z-index: 4;
}
.lb-rail[data-mode="expanded"] { --rail-w: 220px; }
.lb-rail[data-mode="collapsed"] { --rail-w: 56px; }

.lb-rail__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 56px;
  padding: 0 14px 0 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  font-weight: 600;
  letter-spacing: -0.005em;
  font-size: 13.5px;
  overflow: hidden;
  white-space: nowrap;
}
.lb-rail__mark {
  width: 28px; height: 28px;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
  position: relative;
}
.lb-rail__mark::before,
.lb-rail__mark::after {
  content: "";
  position: absolute;
  width: 6px; height: 1.5px;
  background: rgba(255,255,255,0.55);
  top: 50%; transform: translateY(-50%);
}
.lb-rail__mark::before { left: 4px; }
.lb-rail__mark::after  { right: 4px; }
.lb-rail__mark span {
  position: relative;
  width: 8px; height: 8px;
  border-radius: 50%;
  border: 1.5px solid #fff;
  display: block;
}
.lb-rail__wordmark {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}
.lb-rail__wordmark b {
  font-weight: 600;
  font-size: 13.5px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.lb-rail__wordmark small {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
}

.lb-rail__nav {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 10px 8px;
  overflow: hidden;
}

.lb-nav-group {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  padding: 12px 10px 6px;
  font-family: 'IBM Plex Mono', monospace;
  white-space: nowrap;
  overflow: hidden;
}

.lb-nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 7px 9px;
  border-radius: 5px;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.003em;
  cursor: pointer;
  white-space: nowrap;
  text-decoration: none;
  position: relative;
  border: 1px solid transparent;
  height: 32px;
}
.lb-nav-item:hover {
  background: rgba(0,0,0,0.035);
  color: var(--text);
}
[data-theme="dark"] .lb-nav-item:hover { background: rgba(255,255,255,0.04); }

.lb-nav-item[data-active="true"] {
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  border-color: var(--border);
  box-shadow: var(--shadow-card);
}
.lb-nav-item[data-active="true"] .lb-nav-item__ico {
  color: var(--accent);
}
.lb-nav-item[data-active="true"]::before {
  content: "";
  position: absolute;
  left: -8px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}

.lb-nav-item__ico {
  flex: 0 0 22px;
  width: 22px; height: 22px;
  display: grid;
  place-items: center;
  color: var(--text-muted);
}
.lb-nav-item__ico svg { width: 18px; height: 18px; display: block; }
.lb-nav-item__label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lb-nav-item__ext {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  opacity: 0.7;
}

.lb-rail[data-mode="collapsed"] .lb-nav-item__label,
.lb-rail[data-mode="collapsed"] .lb-nav-item__ext,
.lb-rail[data-mode="collapsed"] .lb-rail__wordmark,
.lb-rail[data-mode="collapsed"] .lb-nav-group { display: none; }
.lb-rail[data-mode="collapsed"] .lb-rail__brand { justify-content: center; padding: 0; }
.lb-rail[data-mode="collapsed"] .lb-nav-item {
  justify-content: center;
  padding: 7px 8px;
}

.lb-rail__bottom {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-top: 1px solid var(--border);
}
.lb-rail[data-mode="collapsed"] .lb-rail__bottom { padding: 8px; }

/* ------------------------------------------------------------
   Rail bottom — shared utility button shape.
   Sign-in, theme toggle, and collapse all use the same chrome:
   same border, height, font, icon color, hover.
   ------------------------------------------------------------ */
.lb-rail__btn {
  appearance: none;
  font: inherit;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: 5px;
  height: 32px;
  width: 100%;
  padding: 0 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.003em;
  transition: background 100ms, color 100ms, border-color 100ms;
  text-decoration: none;
}
.lb-rail__btn:hover {
  background: var(--surface-strip);
  color: var(--text);
  border-color: var(--border-strong);
}
.lb-rail__btn svg {
  width: 14px; height: 14px;
  flex-shrink: 0;
  color: var(--text-muted);
  transition: color 100ms, transform 200ms;
}
.lb-rail__btn:hover svg { color: var(--text-secondary); }

.lb-rail__chevron { /* keep selector for chevron-specific rotate behavior */ }
.lb-rail[data-mode="collapsed"] .lb-rail__chevron span { display: none; }
.lb-rail[data-mode="collapsed"] .lb-rail__chevron svg { transform: rotate(180deg); }

/* ------------------------------------------------------------
   Rail — auth / user identity block (sits at top of __bottom)
   ------------------------------------------------------------ */
.lb-rail__user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 5px;
  cursor: pointer;
  text-decoration: none;
  color: var(--text);
  transition: border-color 100ms, background 100ms;
  min-height: 40px;
  font: inherit;
  text-align: left;
  appearance: none;
}
.lb-rail__user:hover {
  border-color: var(--border-strong);
  background: var(--surface-strip);
}
.lb-rail__avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 600;
  font-size: 10.5px;
  letter-spacing: 0.04em;
  position: relative;
  text-transform: uppercase;
}
[data-theme="dark"] .lb-rail__avatar { color: var(--text-inverse); }
.lb-rail__avatar::after {
  /* live-session indicator dot */
  content: "";
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--success);
  border: 2px solid var(--surface-rail);
  box-sizing: border-box;
}
.lb-rail__user-text {
  flex: 1; min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
  line-height: 1.18;
  overflow: hidden;
}
.lb-rail__user-name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Sign-in CTA — light accent treatment: tinted bg + accent border/text */
.lb-rail__signin {
  background: var(--accent-soft);
  border-color: var(--accent-border);
  color: var(--accent);
}
.lb-rail__signin svg { color: var(--accent); }
.lb-rail__signin:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  filter: brightness(0.97);
}
[data-theme="dark"] .lb-rail__signin:hover { filter: brightness(1.08); }
.lb-rail__signin:hover svg { color: var(--accent); }
.lb-rail__signin-label { text-align: center; }

/* Collapse button — darker, more recessive utility chrome */
.lb-rail__chevron {
  background: transparent;
  border-color: transparent;
  color: var(--text-muted);
  height: 26px;
  font-size: 11px;
  letter-spacing: 0.02em;
}
.lb-rail__chevron svg { color: var(--text-muted); }
.lb-rail__chevron:hover {
  background: rgba(0,0,0,0.04);
  border-color: transparent;
  color: var(--text-secondary);
}
[data-theme="dark"] .lb-rail__chevron:hover { background: rgba(255,255,255,0.04); }

/* Collapsed rail — keep only avatar / key glyph, hide labels */
.lb-rail[data-mode="collapsed"] .lb-rail__user {
  padding: 5px;
  justify-content: center;
  min-height: 36px;
}
.lb-rail[data-mode="collapsed"] .lb-rail__user-text,
.lb-rail[data-mode="collapsed"] .lb-rail__signin-label,
.lb-rail[data-mode="collapsed"] .lb-rail__theme-label { display: none; }
.lb-rail[data-mode="collapsed"] .lb-rail__btn {
  padding: 0;
}

/* Backdrop dim when expanded over a page */
.lb-rail__backdrop {
  position: absolute;
  top: 0; bottom: 0;
  left: var(--rail-w, 56px);
  right: 0;
  background: rgba(26,25,22,0.18);
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
  z-index: 3;
}
.lb-rail[data-mode="expanded"] + .lb-rail__backdrop { opacity: 1; }

/* ============================================================
   Bookmark mode — small tab pinned over Jupyter/Grafana
   ============================================================ */
.lb-bookmark {
  position: absolute;
  left: 12px;
  bottom: 12px;
  width: 132px;
  height: 32px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 0 8px 0 7px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: var(--shadow-popover);
  z-index: 50;
  cursor: pointer;
  user-select: none;
}
.lb-bookmark__mark {
  width: 20px; height: 20px;
  border-radius: 4px;
  background: var(--accent);
  display: grid; place-items: center;
  color: #fff;
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700;
  font-size: 10px;
  flex-shrink: 0;
}
.lb-bookmark__text {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--text);
}
.lb-bookmark__hint {
  font-size: 10px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
}

.lb-bookmark-overlay {
  position: absolute;
  left: 12px;
  bottom: 12px;
  width: 240px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow-overlay);
  z-index: 51;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.lb-bookmark-overlay__head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-strip);
}
.lb-bookmark-overlay__head .lb-rail__mark { width: 24px; height: 24px; border-radius: 5px; font-size: 11px; }
.lb-bookmark-overlay__nav {
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.lb-bookmark-overlay__foot {
  border-top: 1px solid var(--border);
  padding: 6px;
  display: flex;
  gap: 6px;
  align-items: center;
  background: var(--surface-strip);
}
.lb-bookmark-overlay__foot .lb-icon-btn {
  width: 28px; height: 28px;
}

/* Bookmark overlay — user row (above the foot) */
.lb-bookmark-overlay__user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  text-decoration: none;
  color: var(--text);
  cursor: pointer;
  appearance: none;
  font: inherit;
  text-align: left;
  border-left: 0; border-right: 0; border-bottom: 0;
  width: 100%;
}
.lb-bookmark-overlay__user:hover { background: var(--surface-strip); }
.lb-bookmark-overlay__user .lb-rail__avatar { width: 24px; height: 24px; font-size: 10px; }
.lb-bookmark-overlay__user .lb-rail__user-text { gap: 0; }
.lb-bookmark-overlay__user .lb-rail__user-name { font-size: 12.5px; }

.lb-bookmark-overlay__signin {
  margin: 0;
  border-radius: 0;
  border: 0;
  border-top: 1px solid var(--border);
  height: 38px;
}

/* Theme toggle button (icon-only square that fits the rail) */
.lb-icon-btn {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
}
.lb-icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
.lb-icon-btn svg { width: 14px; height: 14px; }

/* ============================================================
   Sign-in page (/sign-in) — minimal credentials form
   ============================================================ */
.lb-login-page {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 32px;
  /* the rail stays to the left; this fills the rest */
}
.lb-login {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.lb-login__card {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow-card);
  padding: 28px 30px 22px;
  display: flex;
  flex-direction: column;
}
.lb-login__brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
.lb-login__brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}
.lb-login__brand-text b {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
}
.lb-login__brand-text small {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
}

.lb-login__title {
  margin: 0 0 22px;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.012em;
  color: var(--text);
}

.lb-login__error {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  margin: 0 0 16px;
  background: var(--danger-soft);
  border: 1px solid var(--danger-border);
  border-left: 3px solid var(--danger);
  border-radius: 4px;
  font-size: 12.5px;
  color: var(--text);
  line-height: 1.5;
}
.lb-login__error-mark {
  width: 18px; height: 18px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--danger);
  color: #fff;
  display: grid;
  place-items: center;
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700;
  font-size: 12px;
  line-height: 1;
}

/* Form fields ----------------------------------------------- */
.lb-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 14px;
}
.lb-field__label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
}
.lb-field__wrap {
  position: relative;
  display: flex;
}
.lb-field__input {
  font: inherit;
  width: 100%;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--border-input);
  border-radius: 5px;
  background: var(--surface);
  color: var(--text);

/* Checkbox -------------------------------------------------- */
.lb-check {

.lb-check__box {
  width: 16px; height: 16px;

  place-items: center;
  color: transparent;

}

// Lab Bridge — Sign-in page (/sign-in)
// Minimal credentials form: username + password.
// Sign-up is intentionally absent — credentials are issued by admin.
/* global React, LB_ICONS, LBBrandMark */

function LBLogin({ lang = "en", error = null, loading = false }) {
  const t = lang === "ru" ? LOGIN_STRINGS.ru : LOGIN_STRINGS.en;
  const [u, setU] = React.useState("");
  const [p, setP] = React.useState("");
  const [show, setShow] = React.useState(false);
  const [remember, setRemember] = React.useState(false);

  return (
    <div className="lb-page lb-login-page">
      <main className="lb-login">
        <form className="lb-login__card" onSubmit={(e) => e.preventDefault()}>
          <h1 className="lb-login__title">{t.title}</h1>

          {error && (
            <div className="lb-login__error" role="alert">
              <span className="lb-login__error-mark" aria-hidden="true">!</span>
              <span>{error}</span>
            </div>
          )}

          <div className="lb-field">
            <label className="lb-field__label" htmlFor="lb-username">{t.username}</label>
            <input id="lb-username"
                   className="lb-field__input"
                   type="text"
                   autoComplete="username"
                   spellCheck="false"
                   autoCapitalize="off"
                   value={u}
                   onChange={(e) => setU(e.target.value)}
                   placeholder={t.usernamePh} />
          </div>

          <div className="lb-field">
            <label className="lb-field__label" htmlFor="lb-password">{t.password}</label>
            <div className="lb-field__wrap">
              <input id="lb-password"
                     className="lb-field__input"
                     type={show ? "text" : "password"}
                     autoComplete="current-password"
                     value={p}
                     onChange={(e) => setP(e.target.value)}
                     placeholder={t.passwordPh} />
              <button type="button"
                      className="lb-field__reveal"
                      aria-label={show ? t.hide : t.show}
                      aria-pressed={show}
                      onClick={() => setShow(s => !s)}>
                {show ? LoginIcons.eyeOff : LoginIcons.eye}
              </button>
            </div>
          </div>

          <label className="lb-check">
            <input type="checkbox"
                   className="lb-check__input"
                   checked={remember}
                   onChange={(e) => setRemember(e.target.checked)} />
            <span className="lb-check__box" aria-hidden="true">
              <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 7l3 3 5-6" />
              </svg>
            </span>
            <span className="lb-check__text">
              <span className="lb-check__label">{t.remember}</span>
              <span className="lb-check__hint">{t.rememberHint}</span>
            </span>
          </label>

          <button type="submit"
                  className="lb-login__submit"
                  disabled={loading || !u || !p}>
            {loading ? <span className="lb-login__spinner" aria-hidden="true" /> : LoginIcons.arrow}
            <span>{loading ? t.signingIn : t.submit}</span>
          </button>

          <footer className="lb-login__foot">
            <span className="lb-login__foot-lock" aria-hidden="true">{LB_ICONS.signin}</span>
            <span>{t.adminNote}</span>
          </footer>
        </form>
      </main>
    </div>
  );
}

    title:   "Выйти?",
    body:    "Вы выйдете из lab-bridge. Активные сессии JupyterLab, Grafana и Flasher будут закрыты.",
    cancel:  "Отмена",
    confirm: "Выйти",
  },
};

Object.assign(window, { LBSignOutDialog });
  </script>

  <script type="text/babel" data-presets="react">
    const OPERATOR = { name: "Anna Volkova", role: "operator · lab-12", initials: "AV" };

    function Card({ label, children }) {
      return (
        <div className="preview-card">
          <div className="preview-card__label">{label}</div>
          <div className="preview-card__body">{children}</div>
        </div>
      );
    }

    function Frame({ children, user }) {
      return (
        <LBAuthContext.Provider value={user}>
          <div style={{ display: 'flex', width: '100%', height: '100%', background: 'var(--bg-page)' }}>
            {children}
          </div>
        </LBAuthContext.Provider>
      );
    }

    function App() {
      return (
        <>
          <h2>Navbar — login state</h2>
          <Card label="Expanded · signed in">
            <Frame user={OPERATOR}>
              <LBRail mode="expanded" active="home" />
              <div style={{ flex: 1 }} />
            </Frame>
          </Card>
          <Card label="Expanded · signed out">
            <Frame user={null}>
              <LBRail mode="expanded" active="home" />
              <div style={{ flex: 1 }} />
            </Frame>
          </Card>
          <Card label="Collapsed · signed in">
            <Frame user={OPERATOR}>
              <LBRail mode="collapsed" active="home" />
              <div style={{ flex: 1 }} />
            </Frame>
          </Card>
          <Card label="Collapsed · signed out">
            <Frame user={null}>
              <LBRail mode="collapsed" active="home" />
              <div style={{ flex: 1 }} />
            </Frame>
          </Card>

          <h2>Sign-in page</h2>
          <Card label="/sign-in · default">
            <Frame user={null}>
              <LBRail mode="collapsed" active={null} />
              <LBLogin lang="en" />
            </Frame>
          </Card>
          <Card label="/sign-in · wrong credentials">
            <Frame user={null}>
              <LBRail mode="collapsed" active={null} />
              <LBLogin lang="en" error="Invalid username or password. Try again or ask your administrator." />
            </Frame>
          </Card>

          <h2>Error states</h2>
          <Card label="403 — access denied">
            <Frame user={OPERATOR}>
              <LBRail mode="collapsed" active={null} />
              <LBForbidden lang="en" attemptedPath="/admin/users" requiredRole="admin" />
            </Frame>
          </Card>
          <Card label="404 — not found">
            <Frame user={OPERATOR}>
              <LBRail mode="collapsed" active={null} />
              <LBNotFound lang="en" attemptedPath="/lab/benchz-42" />
            </Frame>
          </Card>

          <h2>Dialogs</h2>
          <Card label="Sign-out confirmation">
            <Frame user={OPERATOR}>
              <LBRail mode="expanded" active="home" />
              <div style={{ flex: 1, position: 'relative' }}>
                <LBSignOutDialog lang="en" user={OPERATOR} />
              </div>
            </Frame>
          </Card>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
