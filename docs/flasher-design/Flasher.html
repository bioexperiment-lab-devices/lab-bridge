// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel" data-presets="react">
// Flasher — browser-window shell + shared primitives
/* global React */

const { useState } = React;

const FLASHER_TABS = [
  { id: "flash",    label: "Flash" },
  { id: "firmware", label: "Firmware" },
  { id: "backups",  label: "Backups" },
  { id: "logs",     label: "Logs" },
];

function FlBrowser({ path = "/flash", children }) {
  return (
    <div className="fl-window">
      <div className="fl-chrome">
        <div className="fl-traffic"><i /><i /><i /></div>
        <div className="fl-addr">
          <span className="fl-addr__lock">⌬</span>
          <span><span className="fl-muted">https://</span>flasher.lab.internal<span className="fl-addr__path">{path}</span></span>
        </div>
      </div>
      {children}
    </div>
  );
}

function FlTopbar({ activeTab, health = { tone: "ok", label: "all 4 lab machines online" } }) {
  return (
    <div className="fl-topbar">
      <div className="fl-brand">
        <span className="fl-brand__mark">F</span>
        Flasher
        <span className="fl-brand__chip">v0.9.3</span>
      </div>
      <div className="fl-topbar__tabs">
        {FLASHER_TABS.map(t => (
          <button key={t.id} className="fl-tab" data-active={t.id === activeTab}>
            {t.label}
          </button>
        ))}
      </div>
      <div className="fl-topbar__right">
        <span className="fl-topbar__health" data-tone={health.tone}>
          <i />{health.label}
        </span>
      </div>
    </div>
  );
}

// ===== Custom dropdown (replaces native <select>) =====
function FlDropdown({ value, options, placeholder = "(select…)", width, mono = false, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);
  const current = options.find(o => o.value === value);
  return (
    <div className="fl-dd" ref={ref} style={width ? { width, maxWidth: "100%" } : undefined}>
      <button
        type="button"
        className="fl-dd__btn"
        data-open={open || undefined}
        data-placeholder={!current || undefined}
        style={mono ? { fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 } : undefined}
        onClick={() => setOpen(o => !o)}>
        {current ? current.label : placeholder}
      </button>
      {open && (
        <div className="fl-dd__panel">
          {options.map(o => (
            <div key={o.value}
                 className="fl-dd__opt"
                 data-active={o.value === value || undefined}
                 data-disabled={o.disabled || undefined}
                 style={mono ? { fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 } : undefined}
                 onClick={() => { if (o.disabled) return; onChange && onChange(o.value); setOpen(false); }}>
              <span>{o.label}</span>
              {o.value === value && <span className="fl-dd__check">✓</span>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ===== Date input — replaces text inputs for since/until =====
function FlDateInput({ value, onChange }) {
  return <input type="date" className="fl-date" defaultValue={value} onChange={e => onChange && onChange(e.target.value)} />;
}

// ===== Badge multi-select with X to remove + "+ add" dropdown =====
function FlBadgeMulti({ selected = [], options = [], onAdd, onRemove, addLabel = "Add", emptyLabel = "(none)", toneFor, mono = false, bare = false }) {
  const [open, setOpen] = useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);
  const labelOf = (v) => {
    const o = options.find(o => o.value === v);
    return o ? o.label : v;
  };
  const available = options.filter(o => !selected.includes(o.value));
  return (
    <div className={"fl-multi" + (bare ? " fl-multi--bare" : "")}>
      {selected.length === 0 && <span className="fl-multi__empty">{emptyLabel}</span>}
      {selected.map(v => (
        <span key={v}
              className={"fl-multi__badge" + (mono ? " fl-multi__badge--mono" : "")}
              data-tone={toneFor ? toneFor(v) : undefined}>
          <span>{labelOf(v)}</span>
          <button type="button" className="fl-multi__x" onClick={() => onRemove && onRemove(v)} aria-label={"Remove " + labelOf(v)}>×</button>
        </span>
      ))}
      <div ref={ref} style={{ position: "relative", display: "inline-block" }}>
        <button type="button" className="fl-multi__add" onClick={() => setOpen(o => !o)} disabled={available.length === 0}>
          <span className="fl-multi__add__plus">+</span>
          <span>{addLabel}</span>
        </button>
        {open && available.length > 0 && (
          <div className="fl-dd__panel" style={{ left: 0, right: "auto", minWidth: 180 }}>
            {available.map(o => (
              <div key={o.value} className="fl-dd__opt"
                   style={mono ? { fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 } : undefined}
                   onClick={() => { onAdd && onAdd(o.value); setOpen(false); }}>
                <span>{o.label}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function FlPage({ title, subtitle, actions, children }) {
  return (
    <div className="fl-body">
      <div className="fl-page">
        {(title || actions) && (
          <header className="fl-page__head">
            <div>
              <h1 className="fl-page__title">{title}</h1>
              {subtitle && <div className="fl-page__sub">{subtitle}</div>}
            </div>
            {actions && <div className="fl-page__actions">{actions}</div>}
          </header>
        )}
        {children}
      </div>
    </div>
  );
}

function FlButton({ variant, small, disabled, leading, children, danger }) {
  const cls = [
    "shp-btn",
    variant === "primary" && "shp-btn--primary",
    (variant === "danger" || danger) && "shp-btn--danger",
    variant === "ghost"   && "shp-btn--ghost",
    small && "shp-btn--sm",
  ].filter(Boolean).join(" ");
  return (
    <button className={cls} disabled={disabled}>
      {leading}
      {children}
    </button>
  );
}

function FlSeg({ value, options }) {
  return (
    <div className="fl-seg">
      {options.map(o => (
        <button key={o.value} className="fl-seg__btn" data-active={o.value === value}>{o.label}</button>
      ))}
    </div>
  );
}

function FlSwitch({ on }) {
  return <span className="fl-switch" data-on={on}></span>;
}

function FlToggleLabel({ on, label }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
      <FlSwitch on={on} />
      <span style={{ fontSize: 12.5, fontWeight: 500, color: on ? "var(--text)" : "var(--text-muted)" }}>{label}</span>
    </span>
  );
}

function FlTag({ name, selected, tone, removable, onClick }) {
  return (
    <span className="fl-tag" data-selected={selected} data-tone={tone}>
      {name}
      {removable && <span className="fl-tag__x">×</span>}
    </span>
  );
}

function FlOutcome({ outcome, tone }) {
  return (
    <span className="fl-outcome" data-tone={tone}>
      <span className="fl-outcome__dot"></span>
      {outcome}
    </span>
  );
}

function FlOutc({ outcome, tone }) {
  // compact version (for tables)
  return <span className="fl-outc" data-tone={tone}>{outcome}</span>;
}

const STAGE_ORDER = ["preflight", "backup", "erase", "program", "verify", "test", "rollback"];

function FlStageStrip({ states }) {
  // states = { preflight: "ok", backup: "ok", erase: "ok", program: "ok", verify: "failed", test: "skipped", rollback: "ok" }
  return (
    <div className="fl-stage">
      {STAGE_ORDER.map(s => (
        <span key={s} className="fl-stage__chip" data-state={states[s] || "na"} title={`${s}: ${states[s] || "n/a"}`}>
          {s}
        </span>
      ))}
    </div>
  );
}

function FlHexInput({ label, value, ascii, bytes, error, mono = true, labelWidth = 130 }) {
  return (
    <div className="fl-hex">
      <div className="fl-hex__row" style={{ gridTemplateColumns: `${labelWidth}px minmax(0, 1fr)` }}>
        <span className="fl-hex__label">{label}</span>
        <input className="fl-hex__input" defaultValue={value} data-error={!!error} readOnly />
      </div>
      <div className="fl-hex__meta" style={{ paddingLeft: labelWidth + 10 }}>
        {error
          ? <span className="fl-hex__meta--err">invalid hex</span>
          : <span><b>{bytes}</b> bytes</span>}
        {!error && ascii != null && <span>ASCII: <b>"{ascii}"</b></span>}
      </div>
    </div>
  );
}

function FlHexDiff({ expected, received, diffIdx = [] }) {
  const renderRow = (bytes, role) => (
    <div className="fl-diff__row">
      <div className="fl-diff__lbl">{role}</div>
      <div className="fl-diff__bytes">
        {bytes.map((b, i) => (
          <span key={i} className="fl-diff__byte" data-diff={diffIdx.includes(i)}>{b}</span>
        ))}
      </div>
    </div>
  );
  const matches = diffIdx.length === 0;
  return (
    <div className="fl-diff">
      {renderRow(expected, "Expected")}
      {renderRow(received, "Received")}
      <div className={"fl-diff__foot" + (matches ? "" : " fl-diff__foot--err")}>
        <span>{matches ? "Byte-for-byte match." : `${diffIdx.length} byte(s) differ.`}</span>
        <span className="fl-muted">{expected.length} bytes total</span>
      </div>
    </div>
  );
}

function FlStatsCard({ total, lastFlashed }) {
  return (
    <div className="fl-stats">
      <span className="fl-stat__lbl">Total flashes</span>
      <span className="fl-stat__val">{total}</span>
      {lastFlashed && (
        <span className="fl-stat__sub">last · {lastFlashed}</span>
      )}
    </div>
  );
}

// Simple JSON renderer with light syntax colors
function FlJSON({ data }) {
  const json = JSON.stringify(data, null, 2);
  // crude tokenizer for keys / strings / numbers / booleans
  const html = json
    .replace(/(&|<|>)/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[ch])
    .replace(/("(?:[^"\\]|\\.)*?")(\s*:)/g, '<span class="fl-json-k">$1</span>$2')
    .replace(/:\s*("(?:[^"\\]|\\.)*?")/g, (m, s) => m.replace(s, `<span class="fl-json-s">${s}</span>`))
    .replace(/:\s*(-?\d+(?:\.\d+)?)/g, (m, n) => m.replace(n, `<span class="fl-json-n">${n}</span>`))
    .replace(/:\s*(true|false|null)/g, (m, b) => m.replace(b, `<span class="fl-json-b">${b}</span>`));
  return <pre dangerouslySetInnerHTML={{ __html: html }} />;
}

function FlModalScrim({ children }) {
  return <div className="shp-modal-scrim">{children}</div>;
}

Object.assign(window, {
  FlBrowser, FlTopbar, FlPage, FlButton, FlSeg, FlSwitch, FlToggleLabel,
  FlTag, FlOutcome, FlOutc, FlStageStrip, FlHexInput, FlHexDiff, FlStatsCard,
  FlJSON, FlModalScrim, STAGE_ORDER,
  FlDropdown, FlDateInput, FlBadgeMulti,
});

</script>

<script type="text/babel" data-presets="react">
// Flasher — Flash tab content (form + Running view + Result view)
/* global React, FlButton, FlSeg, FlSwitch, FlTag, FlHexInput, FlOutcome,
   FlStageStrip, FlJSON, FlDropdown */

function FlashForm({
  machines, selectedMachine, ports, selectedPort,
  sourceKind, sourceList, selectedSource,
  tagFilter,
  searchTerm,
  testOn, testCommand, testResponse,
  skipBackup,
  submitEnabled,
  submitLabel = "Disconnect device and flash",
  errorMsg,
}) {
  // ===== Step 1: Lab machine =====
  const stepOne = (
    <section className="fl-step" data-state="done">
      <div className="fl-step__head">
        <span className="fl-step__num">1</span>
        <span className="fl-step__title">Lab machine</span>
        <span className="fl-step__sub">{selectedMachine || "select a host"}</span>
        <div className="fl-step__actions">
          <FlButton small>Retry probe</FlButton>
        </div>
      </div>
      <div className="fl-step__body">
        <div className="shp-field" style={{ gridTemplateColumns: "120px 1fr" }}>
          <label className="shp-field__label">Client</label>
          <div className="shp-field__col">
            <div className="shp-input-row">
              <FlDropdown
                value={selectedMachine || ""}
                width={320}
                mono
                placeholder="(select…)"
                options={machines.map(m => ({
                  value: m.name,
                  label: m.online ? m.name : (m.name + "  — offline"),
                  disabled: !m.online,
                }))} />
              <span className="fl-muted fl-mono" style={{ fontSize: 11, whiteSpace: "nowrap" }}>
                {machines.filter(m => m.online).length} online
              </span>
            </div>
          </div>
        </div>
      </div>
    </section>
  );

  // ===== Step 2: Serial port =====
  const stepTwo = selectedMachine && (
    <section className="fl-step" data-state={selectedPort ? "done" : "active"}>
      <div className="fl-step__head">
        <span className="fl-step__num">2</span>
        <span className="fl-step__title">Serial port</span>
        <span className="fl-step__sub">{selectedPort || `${ports.length} ports`}</span>
        <div className="fl-step__actions">
          <FlButton small>Refresh</FlButton>
        </div>
      </div>
      <div className="fl-step__body" style={{ padding: 0 }}>
        <table className="shp-table shp-table--rowselect">
          <thead>
            <tr>
              <th>Port</th>
              <th>Product</th>
              <th>VID:PID</th>
              <th>Serial</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            {ports.map(p => {
              const isSelected = p.port === selectedPort;
              return (
                <tr key={p.port} data-flash-selected={isSelected}
                    style={{ opacity: p.dim ? 0.55 : 1 }}>
                  <td className="shp-strong">{p.port}</td>
                  <td>{p.product || <span className="shp-dim">—</span>}</td>
                  <td>{p.vidpid || <span className="shp-dim">—</span>}</td>
                  <td>{p.serial || <span className="shp-dim">—</span>}</td>
                  <td>
                    {p.inUse
                      ? <span className="fl-instatus">connected device</span>
                      : <span className="fl-instatus" data-tone="free">free</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </section>
  );

  // ===== Step 3: Firmware source =====
  const stepThree = selectedPort && (
    <section className="fl-step" data-state={selectedSource ? "done" : "active"}>
      <div className="fl-step__head">
        <span className="fl-step__num">3</span>
        <span className="fl-step__title">Firmware source</span>
        <span className="fl-step__sub">
          {selectedSource ? `${selectedSource.kind}: ${selectedSource.name}` : `pick a ${sourceKind} record`}
        </span>
        <div className="fl-step__actions">
          <FlSeg value={sourceKind} options={[
            { value: "firmware", label: "Firmware" },
            { value: "backups",  label: "Backups" },
          ]}/>
          <FlButton small leading={<span style={{ color: "var(--accent)", fontWeight: 600 }}>+</span>}>New firmware</FlButton>
        </div>
      </div>
      <div className="fl-step__body">
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <input className="shp-input" placeholder="search by name" defaultValue={searchTerm || ""} style={{ flex: "0 0 320px", maxWidth: 320 }} />
          {sourceKind === "firmware" && (
            <div style={{ display: "flex", gap: 4, flexWrap: "wrap", alignItems: "center" }}>
              {["production", "v2", "v3-beta", "experimental"].map(t => (
                <FlTag key={t} name={t} selected={tagFilter.includes(t)}
                       tone={t === "production" ? "prod" : t === "v3-beta" ? "beta" : t === "experimental" ? "exp" : null} />
              ))}
            </div>
          )}
        </div>
        <div className="fl-srclist">
          {sourceList.map(s => (
            <div key={s.id} className="fl-src" data-selected={selectedSource && selectedSource.id === s.id}>
              <div className="fl-src__main">
                <span className="fl-src__name">{s.name}</span>
                {s.tags && (
                  <span className="fl-src__tags">
                    {s.tags.map(t => (
                      <FlTag key={t} name={t} tone={t === "production" ? "prod" : t === "v3-beta" ? "beta" : t === "experimental" ? "exp" : null} />
                    ))}
                  </span>
                )}
                <span className="fl-src__meta">
                  {s.kind === "firmware"
                    ? <>sha <b>{s.sha}</b> · {s.size} B · flashes: <b>{s.flashes}</b></>
                    : <>{s.captured} · <b>{s.client}</b>/{s.portName} · sha <b>{s.sha}</b></>}
                </span>
              </div>
            </div>
          ))}
        </div>
        {selectedSource && (
          <div className="fl-srcpicked">
            <span className="fl-srcpicked__lbl">Selected · {selectedSource.kind}</span>
            <span className="fl-srcpicked__name">{selectedSource.name}</span>
            <span className="fl-spacer"></span>
            <FlButton small variant="ghost">Clear</FlButton>
          </div>
        )}
      </div>
    </section>
  );

  // ===== Step 4: Post-flash test =====
  const stepFour = selectedSource && (
    <section className="fl-step" data-state="active">
      <div className="fl-step__head">
        <span className="fl-step__num">4</span>
        <span className="fl-step__title">Post-flash test</span>
        <span className="fl-step__sub">
          {testOn ? "device must reply with expected bytes" : "byte-verify only — no test payload"}
        </span>
        <div className="fl-step__actions">
          <FlSwitch on={testOn} />
        </div>
      </div>
      <div className="fl-step__body">
        {testOn ? (
          <>
            <FlHexInput label="test_command"
              value={testCommand.hex} bytes={testCommand.bytes} ascii={testCommand.ascii} />
            <FlHexInput label="expected_response"
              value={testResponse.hex} bytes={testResponse.bytes} ascii={testResponse.ascii}
              error={testResponse.error} />
            {selectedSource.kind === "firmware" && (
              <span className="shp-checkbox" data-checked={false}>
                <span className="shp-checkbox__box"></span>
                <span>Save edits to firmware record</span>
              </span>
            )}
          </>
        ) : (
          <div className="shp-info-block" style={{ background: "var(--surface-sunken)", borderColor: "var(--border)", color: "var(--text-secondary)" }}>
            <span className="shp-info-block__icon" style={{ color: "var(--text-muted)" }}>i</span>
            <span>The flash will succeed on byte-verify alone. No payload will be sent to the device after programming.</span>
          </div>
        )}
      </div>
    </section>
  );

  // ===== Step 5: Options =====
  const stepFive = selectedSource && (
    <section className="fl-step" data-state="active">
      <div className="fl-step__head">
        <span className="fl-step__num">5</span>
        <span className="fl-step__title">Options</span>
        <span className="fl-step__sub">{skipBackup ? "⚠ skip backup is ON" : "current flash will be backed up first"}</span>
        <div className="fl-step__actions">
          <FlToggleLabel on={skipBackup} label="Skip backup" />
        </div>
      </div>
      <div className="fl-step__body">
        {skipBackup ? (
          <div className="shp-info-block">
            <span className="shp-info-block__icon">⚠</span>
            <span>The device's existing flash will <b>not</b> be saved. There will be no way to restore the previous firmware from the lab machine if this flash needs to be rolled back.</span>
          </div>
        ) : (
          <div className="shp-info-block" style={{ background: "var(--surface-sunken)", borderColor: "var(--border)", color: "var(--text-secondary)" }}>
            <span className="shp-info-block__icon" style={{ color: "var(--text-muted)" }}>i</span>
            <span>The current device flash will be captured to disk on the lab machine before erasing. Adds <b>~8 s</b>.</span>
          </div>
        )}
      </div>
    </section>
  );

  // ===== Submit bar =====
  const submit = selectedSource && (
    <div className="fl-submit-bar">
      <span className="fl-submit-bar__msg">
        Will release the device on <b>{selectedPort}</b> ({selectedMachine}), then erase + program + verify{testOn && " + test"}.
      </span>
      <FlButton variant="primary" disabled={!submitEnabled}>{submitLabel}</FlButton>
    </div>
  );

  const errBlock = errorMsg && (
    <div className="fl-errblock">
      <span className="fl-errblock__code">Server error</span>
      <span className="fl-errblock__msg">{errorMsg}</span>
    </div>
  );

  return (
    <div className="fl-flash__col">
      {stepOne}
      {stepTwo}
      {stepThree}
      {stepFour}
      {stepFive}
      {errBlock}
      {submit}
    </div>
  );
}

// ===== Output area states =====

function FlashOutput_Empty() {
  return (
    <div className="fl-output">
      <div className="fl-output__head">
        <span className="fl-output__title">Output</span>
        <span className="fl-spacer"></span>
        <span className="fl-muted fl-mono" style={{ fontSize: 11 }}>idle</span>
      </div>
      <div className="fl-output__empty">
        The Running view + Result will appear here after you submit.
      </div>
    </div>
  );
}

function FlashOutput_Running({ machine, port, source, elapsed, stage, otherUser }) {
  return (
    <div className="fl-output">
      <div className="fl-output__head">
        <span className="fl-output__title">Running</span>
        <span className="fl-spacer"></span>
        <span className="fl-muted fl-mono" style={{ fontSize: 11 }}>{elapsed} elapsed</span>
      </div>
      <div className="fl-output__body">
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, letterSpacing: "-0.01em", marginBottom: 6 }}>Flashing…</div>
          <div className="fl-mono fl-muted" style={{ fontSize: 11.5 }}>
            <b style={{ color: "var(--text-secondary)" }}>{machine}</b> · <b style={{ color: "var(--text-secondary)" }}>{port}</b> · {source}
          </div>
        </div>
        <div className="fl-progress"></div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 22, fontWeight: 600, color: "var(--text)", fontFeatureSettings: '"tnum" 1' }}>
            {elapsed}
          </span>
          <span className="fl-muted fl-mono" style={{ fontSize: 11 }}>elapsed</span>
          <span className="fl-spacer"></span>
          <span className="fl-muted fl-mono" style={{ fontSize: 11 }}>typical 15–30s · max ~60s</span>
        </div>
        <FlStageStrip states={stage} />
        <div className="fl-muted fl-mono" style={{ fontSize: 11, lineHeight: 1.5 }}>
          A flash, once started, runs to completion. Rollback-on-failure is automatic. There is no Cancel.
        </div>
      </div>
    </div>
  );
}

function FlashOutput_Success({ meta, raw, stage }) {
  return (
    <div className="fl-output">
      <div className="fl-output__head">
        <span className="fl-output__title">Result</span>
        <span className="fl-spacer"></span>
        <FlOutcome outcome="success" tone="green" />
      </div>
      <div className="fl-output__body">
        <FlStageStrip states={stage} />
        <dl className="fl-dl">
          <dt>Client</dt><dd>{meta.client}</dd>
          <dt>Port</dt><dd>{meta.port}</dd>
          <dt>Firmware</dt><dd>{meta.firmware}</dd>
          <dt>Started</dt><dd>{meta.started}</dd>
          <dt>Finished</dt><dd>{meta.finished}</dd>
          <dt>Duration</dt><dd>{meta.durationMs} ms</dd>
          <dt>Backup ID</dt><dd><a href="#">{meta.backupId}</a></dd>
        </dl>
        <details className="fl-details">
          <summary>Raw result JSON</summary>
          <FlJSON data={raw} />
        </details>
      </div>
    </div>
  );
}

function FlashOutput_Failure({ meta, errorCode, errorDetail, stage, diff }) {
  return (
    <div className="fl-output">
      <div className="fl-output__head">
        <span className="fl-output__title">Result</span>
        <span className="fl-spacer"></span>
        <FlOutcome outcome="rolled_back_verify_failed" tone="amber" />
      </div>
      <div className="fl-output__body">
        <div className="fl-errblock">
          <span className="fl-errblock__code">{errorCode}</span>
          <span className="fl-errblock__msg">{errorDetail}</span>
        </div>
        <FlStageStrip states={stage} />
        {diff && (
          <FlHexDiff expected={diff.expected} received={diff.received} diffIdx={diff.diffIdx} />
        )}
        <dl className="fl-dl">
          <dt>Client</dt><dd>{meta.client}</dd>
          <dt>Port</dt><dd>{meta.port}</dd>
          <dt>Firmware</dt><dd>{meta.firmware}</dd>
          <dt>Started</dt><dd>{meta.started}</dd>
          <dt>Finished</dt><dd>{meta.finished}</dd>
          <dt>Duration</dt><dd>{meta.durationMs} ms</dd>
          <dt>Backup ID</dt><dd><a href="#">{meta.backupId}</a></dd>
        </dl>
      </div>
    </div>
  );
}

Object.assign(window, {
  FlashForm, FlashOutput_Empty, FlashOutput_Running,
  FlashOutput_Success, FlashOutput_Failure,
});

</script>

<script type="text/babel" data-presets="react">
// Flasher — Firmware tab + Backups tab + modals
/* global React, FlButton, FlTag, FlStatsCard, FlOutc, FlHexInput, FlDropdown, FlBadgeMulti */

// ============================================================
// FIRMWARE TAB
// ============================================================

function FirmwareTab({ list, selectedId, tagFilter, search, detail }) {
  return (
    <div className="fl-twopane">
      {/* LEFT pane — list */}
      <div className="fl-pane">
        <div className="fl-pane__head">
          <div className="fl-pane__searchrow">
            <input className="shp-input" placeholder="search by name" defaultValue={search || ""} />
          </div>
          <div className="fl-pane__tags">
            {[
              { n: "production", tone: "prod" },
              { n: "v2",         tone: null   },
              { n: "v3-beta",    tone: "beta" },
              { n: "experimental", tone: "exp" },
              { n: "fixture-only", tone: null },
              { n: "deprecated", tone: null  },
            ].map(t => (
              <FlTag key={t.n} name={t.n} tone={t.tone} selected={(tagFilter || []).includes(t.n)} />
            ))}
          </div>
        </div>
        <div style={{ overflow: "auto", flex: "1 1 auto" }}>
          {list.map(f => (
            <div key={f.id} className="fl-row" data-selected={f.id === selectedId}>
              <span></span>
              <div className="fl-row__main">
                <span className="fl-row__name">{f.name}</span>
                <span className="fl-row__tags">
                  {f.tags.map(t => (
                    <FlTag key={t} name={t}
                      tone={t === "production" ? "prod" : t === "v3-beta" ? "beta" : t === "experimental" ? "exp" : null} />
                  ))}
                </span>
                <span className="fl-row__meta">
                  {f.sha} · {f.size} B · flashes: <b>{f.flashes}</b>
                </span>
              </div>
              <div className="fl-row__actions">
                <FlButton small variant="ghost">Download</FlButton>
                <FlButton small variant="ghost" danger>Delete</FlButton>
              </div>
            </div>
          ))}

      </div>

      {/* RIGHT pane — detail */}
      <div className="fl-pane">
        {detail
          ? <FirmwareDetail {...detail} />
          : <FirmwareDetailEmpty />}

function FirmwareDetailEmpty() {
  return (
    <div className="fl-output__empty" style={{ padding: "120px 24px" }}>
      <div className="fl-output__empty-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5"/>
        </svg>
      </div>
      Select a firmware record on the left.
    </div>
  );
}

function FirmwareDetail({ name, sha256, size, created, stats, form, history }) {
  return (
    <>
      <div className="fl-detail__head">
        <h2 className="fl-detail__h">{name}</h2>
        <div className="fl-detail__sub">sha256 {sha256} · {size} B · created {created}</div>
      </div>
      <div className="fl-detail__body">
        <FlStatsCard {...stats} />

        <div>
          <div className="fl-dh">Edit</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div className="shp-field" style={{ gridTemplateColumns: "140px 1fr" }}>
              <label className="shp-field__label">Name</label>
              <div className="shp-field__col">
                <input className="shp-input" defaultValue={form.name} />
              </div>
            </div>
            <div className="shp-field" style={{ gridTemplateColumns: "140px 1fr", alignItems: "start" }}>
              <label className="shp-field__label">Description</label>
              <div className="shp-field__col">
                <textarea className="shp-input" rows={2}
                          style={{ height: "auto", paddingTop: 6, paddingBottom: 6, resize: "vertical", fontFamily: "'IBM Plex Sans', system-ui, sans-serif" }}
                          defaultValue={form.description} />
              </div>
            </div>
            <FlHexInput label="test_command" labelWidth={140} value={form.testCommand.hex}
              bytes={form.testCommand.bytes} ascii={form.testCommand.ascii} />
            <FlHexInput label="expected_response" labelWidth={140} value={form.testResponse.hex}
              bytes={form.testResponse.bytes} ascii={form.testResponse.ascii} />
            <div className="shp-field" style={{ gridTemplateColumns: "140px 1fr" }}>
              <label className="shp-field__label">Tags</label>
              <div className="shp-field__col">
                <FlBadgeMulti
                  selected={form.allTags.filter(t => t.checked).map(t => t.name)}
                  options={form.allTags.map(t => ({ value: t.name, label: t.name }))}
                  toneFor={(v) => v === "production" ? "prod" : v === "v3-beta" ? "beta" : v === "experimental" ? "exp" : undefined}
                  addLabel="Add tag"
                  emptyLabel="no tags" />
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <FlButton small variant="ghost">Revert</FlButton>
              <FlButton small variant="primary">Save</FlButton>
            </div>
          </div>
        </div>

        <div>
          <div className="fl-dh">Flash history · {history.length}</div>

              <div key={i} className="fl-hist">

<script type="text/babel" data-presets="react">
// Flasher — Logs tab + Log detail drawer
/* global React, FlButton, FlOutc, FlOutcome, FlStageStrip, FlHexDiff, FlJSON, FlDropdown, FlBadgeMulti, FlDateInput */

function LogsTab({ filters, rows, selectedId, drawer }) {
  // Autoload-on-scroll-to-bottom: the table-wrap is the scroll container.
  // When its bottom edge is reached, fetch the next page. (In this design
  // mockup the rows are static, so we just show the persistent footer hint.)
  const wrapRef = React.useRef(null);
  return (
    <>
      <FlLogFilters filters={filters} />
      <div ref={wrapRef} className="shp-table-wrap fl-logs-wrap" style={{ overflow: "auto" }}>

          <thead>
            <tr>
              <th className="col-time">Started</th>
              <th className="col-client">Client</th>
              <th className="col-port">Port</th>
              <th>Source</th>
              <th>Outcome</th>
              <th className="col-dur">Duration</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.id} data-selected={r.id === selectedId}>
                <td className="col-time">{r.started}</td>
                <td>{r.client}</td>
                <td>{r.port}</td>
                <td>
                  <span className="fl-muted" style={{ fontSize: 10.5 }}>{r.sourceKind}:</span>{" "}

                <td><FlOutc outcome={r.outcome} tone={r.tone} /></td>
                <td className="col-dur">{r.duration}</td>
                <td className="col-note">{r.note}</td>

                <span>Loading 50 more — 50 of 234 shown</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      {drawer}

  );
}

function FlLogFilters({ filters }) {
  const clientOptions = [
    { value: "lab-rpi-1", label: "lab-rpi-1" },
    { value: "lab-rpi-2", label: "lab-rpi-2" },

  const outcomeOptions = [
    { value: "success",                   label: "success" },
    { value: "rolled_back_verify_failed", label: "rolled_back_verify_failed" },
    { value: "rolled_back_test_failed",   label: "rolled_back_test_failed" },
    { value: "failed_preflight",          label: "failed_preflight" },
    { value: "failed_backup",             label: "failed_backup" },
    { value: "failed_no_recovery",        label: "failed_no_recovery" },
    { value: "error",                     label: "error" },
    { value: "interrupted",               label: "interrupted" },

  const selectedOutcomes = ["rolled_back_verify_failed", "rolled_back_test_failed"];

  return (
    <div className="fl-filters">

          addLabel="Add client"
          emptyLabel="(any client)"
          mono
          bare />
      </div>

      <div className="fl-filt">
        <div className="fl-filt__lbl">Outcome</div>
        <FlBadgeMulti
          selected={selectedOutcomes}
          options={outcomeOptions}
          addLabel="Add outcome"

          mono
          bare />
      </div>

      <div className="fl-filt">
        <div className="fl-filt__lbl">Source</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <FlDropdown
            value={filters.sourceKind || ""}

            options={[
              { value: "",         label: "(any kind)" },
              { value: "firmware", label: "firmware" },
              { value: "backup",   label: "backup" },
            ]} />

            <FlDropdown
              value={filters.firmwareId || ""}
              placeholder="(any firmware)"
              options={[
                { value: "",     label: "(any firmware)" },
                { value: "mc14", label: "motor-controller-v1.4" },
                { value: "mc15", label: "motor-controller-v1.5" },
                { value: "sb23", label: "sensor-board-v2.3.0" },
                { value: "sb24", label: "sensor-board-v2.4.0" },
              ]} />
          )}
        </div>
      </div>

      <div className="fl-filt">
        <div className="fl-filt__lbl">Date range</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <div className="fl-filt__date-row">

            <FlDateInput value={filters.since || "2026-05-08"} />
          </div>
          <div className="fl-filt__date-row">
            <span>until</span>
            <FlDateInput value={filters.until || "2026-05-15"} />
          </div>
        </div>
      </div>

      <button type="button" className="fl-filt__clear" style={{ display: "none" }}>Clear all filters</button>
    </div>
  );
}

function LogDetailDrawer({ id, meta, stage, diff, raw, note, replay, sourceDeleted }) {
  return (
    <div className="fl-drawer-scrim">
      <div className="fl-drawer">
        <div className="fl-drawer__head">
          <h2 className="fl-drawer__title">Flash <span style={{ color: "var(--text-muted)" }}>·</span> <span style={{ color: "var(--accent)" }}>{id}</span></h2>
          <FlOutcome outcome={meta.outcome} tone={meta.tone} />
          <button className="fl-drawer__close">✕</button>
        </div>
        <div className="fl-drawer__body">
          <dl className="fl-dl" style={{ gridTemplateColumns: "110px 1fr" }}>
            <dt>Started</dt><dd>{meta.started}</dd>
            <dt>Status</dt><dd>done ({meta.outcome})</dd>
            <dt>Client · port</dt><dd>{meta.client} · {meta.port}</dd>
            <dt>Firmware</dt><dd>{meta.firmware}</dd>
            <dt>Source kind</dt><dd>{meta.sourceKind}</dd>
            <dt>Duration</dt><dd>{meta.duration}</dd>
          </dl>

          <div>
            <div className="fl-dh">Stages</div>

            <div className="fl-muted fl-mono" style={{ fontSize: 10.5, marginTop: 6, lineHeight: 1.5 }}>

            <div>
              <div className="fl-dh">Hex diff (test_result)</div>
              <FlHexDiff expected={diff.expected} received={diff.received} diffIdx={diff.diffIdx} />

          )}

          <details className="fl-details">

          <div>

            <textarea className="shp-input" rows={3}

            <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 6, gap: 6 }}>
              <FlButton small variant="primary">Save note</FlButton>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { LogsTab, FlLogFilters, LogDetailDrawer });

</script>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme">
          <TweakRadio label="Mode" value={t.theme} onChange={v => setTweak("theme", v)}
            options={[{ value: "light", label: "Light" }, { value: "dark", label: "Dark" }]} />
        </TweakSection>
        <TweakSection label="Accent">
          <TweakColor label="Color" value={t.accent} onChange={v => setTweak("accent", v)}
            options={["#1F3A8A", "#3B5BA5", "#1F6E62", "#7A3F00", "#5B1F66"]} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

function shade(hex, pct) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) & 0xff, g = (num >> 8) & 0xff, b = num & 0xff;
  const adj = (c) => Math.max(0, Math.min(255, Math.round(c + (pct/100) * 255)));
  return "#" + [adj(r), adj(g), adj(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
