<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flasher — Web UI design</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* ===== SerialHop panel — design tokens & primitives ===== */
:root {
  --bg-page: #ECE9E0;
  --bg-window-outer: #2A2823;

  --surface: #FFFFFF;
  --surface-sunken: #F8F6F0;
  --surface-strip: #FAF8F3;

  --border: #E2DED2;
  --border-strong: #C8C3B5;
  --border-input: #C3BFB2;

  --text: #1A1916;
  --text-secondary: #514E47;
  --text-muted: #8A8678;
  --text-inverse: #FAF8F3;

  --accent: #1F3A8A;
  --accent-hover: #182E6F;
  --accent-soft: #E7ECF6;
  --accent-border: #B8C2DC;

  --success: #2F7D3F;
  --success-soft: #E5F1E6;
  --success-border: #BCD7BE;

  --danger: #B23A2A;
  --danger-soft: #F8E5E0;
  --danger-border: #ECC5BC;

  --warning: #A37200;
  --warning-soft: #F5EAC8;
  --warning-border: #E2D096;

  --neutral-dot: #9F9B8E;
  --shadow-card: 0 1px 0 rgba(26,25,22,0.04), 0 1px 2px rgba(26,25,22,0.06);
  --shadow-popover: 0 10px 24px -8px rgba(26,25,22,0.25), 0 2px 6px rgba(26,25,22,0.08);
}

[data-theme="dark"] {
  --bg-page: #1B1A17;
  --bg-window-outer: #0E0D0B;
  --surface: #232220;
  --surface-sunken: #1D1C19;
  --surface-strip: #1F1E1B;
  --border: #34322D;
  --border-strong: #4A4740;
  --border-input: #4A4740;
  --text: #F0EDE3;
  --text-secondary: #B8B3A4;
  --text-muted: #7E7A6E;
  --text-inverse: #1A1916;
  --accent: #8FA9E8;
  --accent-hover: #B0C2EE;
  --accent-soft: #232844;
  --accent-border: #3A4170;
  --success: #7CC18A;
  --success-soft: #1F2C22;
  --success-border: #335A3E;
  --danger: #E58879;
  --danger-soft: #34211D;
  --danger-border: #6A3D34;
  --warning: #E3C067;
  --warning-soft: #2F2715;
  --warning-border: #5E4C20;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.4;
  color: var(--text);
  background: var(--bg-page);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ===== Window chrome ===== */
.shp-window {
  width: 1080px;
  height: 680px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  color: var(--text);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  position: relative;
}

.shp-titlebar {
  height: 36px;
  background: var(--surface-sunken);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 12px;
  letter-spacing: 0.01em;
  color: var(--text-secondary);
  flex: 0 0 auto;
  user-select: none;
}
.shp-titlebar__title {
  flex: 1;
  font-weight: 500;
}
.shp-titlebar__title b {
  color: var(--text);
  font-weight: 600;
  letter-spacing: -0.005em;
}
.shp-titlebar__chip {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  padding: 1px 6px;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  color: var(--text-secondary);
  background: var(--surface);
  margin-left: 8px;
}
.shp-titlebar__buttons {
  display: flex;
  gap: 6px;
}
.shp-titlebar__btn {
  width: 18px; height: 18px;
  display: grid; place-items: center;
  color: var(--text-muted);
  font-size: 10px;
}

/* ===== Tabs ===== */
.shp-tabs {
  display: flex;
  align-items: stretch;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 8px;
  flex: 0 0 auto;
  gap: 2px;
}
.shp-tab {
  appearance: none;
  background: transparent;
  border: none;
  font: inherit;
  color: var(--text-secondary);
  padding: 10px 14px 9px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  letter-spacing: -0.002em;
}
.shp-tab:hover { color: var(--text); }
.shp-tab[data-active="true"] {
  color: var(--text);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.shp-tab__dirty {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-left: 2px;
}

/* ===== Warning header ===== */
.shp-warning {
  background: var(--warning-soft);
  border-bottom: 1px solid var(--warning-border);
  padding: 8px 14px;
  font-size: 12.5px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 500;
  flex: 0 0 auto;
}
.shp-warning__icon {
  color: var(--warning);
  font-weight: 700;
  font-size: 13px;
}

/* ===== Content area ===== */
.shp-content {
  flex: 1 1 auto;
  overflow: auto;
  background: var(--surface);
  position: relative;
}
.shp-content__pad {
  padding: 18px 20px 20px;
}

/* ===== Footer ===== */
.shp-footer {
  height: 28px;
  background: var(--surface-sunken);
  border-top: 1px solid var(--border);
  padding: 0 12px;
  display: flex;
  align-items: center;
  font-size: 11.5px;
  color: var(--text-secondary);
  flex: 0 0 auto;
  letter-spacing: 0.005em;
  gap: 10px;
  user-select: none;
}
.shp-footer__icon {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 600;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 2px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  color: var(--text-muted);
  letter-spacing: 0.04em;
}
.shp-footer__icon[data-kind="ok"]    { color: var(--success); border-color: var(--success-border); background: var(--success-soft); }
.shp-footer__icon[data-kind="work"]  { color: var(--accent);  border-color: var(--accent-border);  background: var(--accent-soft); }
.shp-footer__icon[data-kind="err"]   { color: var(--danger);  border-color: var(--danger-border);  background: var(--danger-soft); }
.shp-footer__icon[data-kind="info"]  { color: var(--text-secondary); }
.shp-footer__text { flex: 1; }
.shp-footer__text b { color: var(--text); font-weight: 600; }
.shp-footer__time {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}
.shp-footer__progress {
  width: 80px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  overflow: hidden;
  margin-left: 6px;
}
.shp-footer__progress > i {
  display: block;
  height: 100%;
  background: var(--accent);
}

/* ===== Section headers ===== */
.shp-h {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-muted);
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.shp-h::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ===== Lamps ===== */
.shp-lamps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}
.shp-lamp {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 4px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.shp-lamp__row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.shp-lamp__name {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  flex: 1;
}
.shp-lamp__state {
  display: flex;
  align-items: center;
  gap: 9px;
}
.shp-lamp__dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--neutral-dot);
  box-shadow: 0 0 0 3px var(--surface-sunken), inset 0 1px 1px rgba(255,255,255,0.5);
  flex: 0 0 12px;
}
.shp-lamp__dot[data-tone="green"]  { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft), inset 0 1px 1px rgba(255,255,255,0.4); }
.shp-lamp__dot[data-tone="red"]    { background: var(--danger);  box-shadow: 0 0 0 3px var(--danger-soft),  inset 0 1px 1px rgba(255,255,255,0.4); }
.shp-lamp__dot[data-tone="yellow"] { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-soft), inset 0 1px 1px rgba(255,255,255,0.4); }
.shp-lamp__dot[data-tone="grey"]   { background: var(--neutral-dot); box-shadow: 0 0 0 3px var(--surface-sunken); }
.shp-lamp__dot[data-tone="grey"][data-pulse="true"] { animation: shp-pulse 1.6s ease-in-out infinite; }
@keyframes shp-pulse { 50% { opacity: 0.55; } }

.shp-lamp__label {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--text);
}
.shp-lamp__sub {
  font-size: 11.5px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
}

/* ===== Help icon ===== */
.shp-help {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 600;
  display: inline-grid;
  place-items: center;
  cursor: help;
  font-family: 'IBM Plex Mono', monospace;
  line-height: 1;
  flex-shrink: 0;
  position: relative;
}
.shp-help:hover { color: var(--accent); border-color: var(--accent-border); }
.shp-help[data-open="true"] {
  color: var(--accent); border-color: var(--accent);
  background: var(--accent-soft);
}

.shp-popover {
  position: absolute;
  top: calc(100% + 8px);
  left: -8px;
  width: 280px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  z-index: 30;
  box-shadow: var(--shadow-popover);
  text-align: left;
  cursor: default;
}
.shp-popover::before {
  content: "";
  position: absolute;
  top: -6px; left: 12px;
  width: 10px; height: 10px;
  background: var(--surface);
  border-left: 1px solid var(--border-strong);
  border-top: 1px solid var(--border-strong);
  transform: rotate(45deg);
}
.shp-popover h5 {
  margin: 0 0 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.005em;
}
.shp-popover p { margin: 0 0 6px; }
.shp-popover p:last-child { margin-bottom: 0; }
.shp-popover dl {
  margin: 6px 0 0;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 8px;
  font-size: 11.5px;
}
.shp-popover dt { color: var(--text-muted); font-weight: 500; }
.shp-popover dd { margin: 0; color: var(--text); }

/* ===== Buttons ===== */
.shp-btn {
  appearance: none;
  font: inherit;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  height: 30px;
  white-space: nowrap;
}
.shp-btn:hover:not(:disabled) { background: var(--surface-sunken); border-color: var(--text-muted); }
.shp-btn:disabled {
  opacity: 0.5; cursor: not-allowed;
}
.shp-btn--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #FFFFFF;
}
.shp-btn--primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}
.shp-btn--danger {
  background: var(--surface);
  border-color: var(--danger-border);
  color: var(--danger);
}
.shp-btn--danger:hover:not(:disabled) { background: var(--danger-soft); }
.shp-btn--ghost {
  border-color: transparent;
  background: transparent;
}
.shp-btn--ghost:hover:not(:disabled) {
  background: var(--surface-sunken);
}
.shp-btn--sm {
  height: 24px;
  padding: 2px 8px;
  font-size: 11.5px;
}
.shp-btn__shield {
  display: inline-block;
  font-size: 10px;
  font-family: 'IBM Plex Mono', monospace;
  background: rgba(255,255,255,0.18);
  color: inherit;
  padding: 1px 4px;
  border-radius: 2px;
  border: 1px solid currentColor;
  opacity: 0.7;
  line-height: 1;
}
.shp-btn--primary .shp-btn__shield { color: #fff; }
.shp-btn-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* ===== Update row ===== */
.shp-update {
  border: 1px solid var(--border);
  background: var(--surface-sunken);
  border-radius: 4px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
}
.shp-update[data-tone="green"]  { background: var(--success-soft); border-color: var(--success-border); }
.shp-update[data-tone="red"]    { background: var(--danger-soft);  border-color: var(--danger-border); }
.shp-update[data-tone="blue"]   { background: var(--accent-soft);  border-color: var(--accent-border); }
.shp-update__tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-muted);
  flex-shrink: 0;
}
.shp-update[data-tone="green"] .shp-update__tag { color: var(--success); border-color: var(--success-border); }
.shp-update[data-tone="red"] .shp-update__tag { color: var(--danger); border-color: var(--danger-border); }
.shp-update[data-tone="blue"] .shp-update__tag { color: var(--accent); border-color: var(--accent-border); }
.shp-update__msg {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}
.shp-update__msg b { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.shp-update__progressbar {
  flex: 1;
  height: 8px;
  border-radius: 4px;
  background: rgba(0,0,0,0.06);
  overflow: hidden;
  margin: 0 6px;
  max-width: 220px;
}
.shp-update__progressbar > i {
  display: block;
  height: 100%;
  background: var(--accent);
  transition: width 0.4s ease;
}
.shp-update__stats {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--text-secondary);
  white-space: nowrap;
}
.shp-update__actions { display: flex; gap: 6px; }

/* ===== Service actions row ===== */
.shp-service-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  align-items: center;
}
.shp-service-actions__hint {
  margin-left: auto;
  font-size: 11.5px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  white-space: nowrap;
}

/* ===== Card ===== */
.shp-card {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 4px;
  overflow: hidden;
}

/* ===== Form ===== */
.shp-form-section {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 4px;
  margin-bottom: 12px;
}
.shp-form-section__head {
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-strip);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px;
}
.shp-form-section__body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.shp-field {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 14px;
  align-items: start;
}
.shp-field__label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  padding-top: 6px;
  letter-spacing: -0.005em;
}
.shp-field__label[data-disabled="true"] { color: var(--text-muted); }
.shp-field__hint {
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  padding-top: 1px;
}
.shp-field__col { display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }

.shp-input, .shp-select {
  appearance: none;
  font: inherit;
  font-size: 12.5px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  padding: 6px 10px;
  border-radius: 3px;
  border: 1px solid var(--border-input);
  background: var(--surface);
  color: var(--text);
  height: 28px;
  width: 100%;
}
.shp-input--mono { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
.shp-input:focus, .shp-select:focus { outline: 2px solid var(--accent-soft); outline-offset: -1px; border-color: var(--accent); }
.shp-input[data-error="true"] { border-color: var(--danger); background: var(--danger-soft); }
.shp-input[disabled] { background: var(--surface-sunken); color: var(--text-muted); }

.shp-input-row { display: flex; gap: 6px; align-items: center; }
.shp-input-row .shp-input { flex: 1; }

.shp-error {
  color: var(--danger);
  font-size: 11.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 2px;
}
.shp-error::before {
  content: "!";
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700;
  background: var(--danger);
  color: #fff;
  width: 14px; height: 14px;
  border-radius: 50%;
  display: inline-grid; place-items: center;
  font-size: 10px;
}

.shp-checkbox {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--text);
  user-select: none;
}
.shp-checkbox__box {
  width: 16px; height: 16px;
  border-radius: 3px;
  border: 1px solid var(--border-input);
  background: var(--surface);
  display: inline-grid; place-items: center;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.shp-checkbox[data-checked="true"] .shp-checkbox__box {
  background: var(--accent);
  border-color: var(--accent);
}

.shp-listrow {
  display: flex;
  gap: 6px;
  align-items: center;
}
.shp-listrow .shp-input { flex: 1; }

.shp-disabled-note {
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
  margin-top: 4px;
}

.shp-info-block {
  background: var(--warning-soft);
  border: 1px solid var(--warning-border);
  border-radius: 3px;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--text);
  line-height: 1.55;
  display: flex;
  gap: 10px;
}
.shp-info-block__icon { color: var(--warning); font-weight: 700; flex-shrink: 0; }

.shp-banner {
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  border-radius: 3px;
  padding: 10px 14px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 14px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.shp-banner__chip {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--accent);
  color: #fff;
  text-transform: uppercase;
}

/* ===== Tables ===== */
.shp-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  background: var(--surface);
}
.shp-table thead th {
  background: var(--surface-strip);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.shp-table thead th .shp-help { vertical-align: -3px; margin-left: 4px; }
.shp-table tbody td {
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text);
  white-space: nowrap;
}
.shp-table tbody tr:last-child td { border-bottom: none; }
.shp-table tbody tr:hover { background: var(--surface-strip); }
.shp-table tbody tr[data-selected="true"] { background: var(--accent-soft); }
.shp-table tbody tr[data-selected="true"] td { color: var(--text); }
.shp-table td .shp-check { color: var(--success); font-weight: 700; }
.shp-table td .shp-dim { color: var(--text-muted); }
.shp-table--grey tbody td { color: var(--text-muted); }

.shp-table-wrap {
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  background: var(--surface);
}

/* ===== Empty state ===== */
.shp-empty {
  padding: 64px 24px;
  text-align: center;
  background: var(--surface-strip);
  border: 1px dashed var(--border-strong);
  border-radius: 4px;
  color: var(--text-secondary);
}
.shp-empty__title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin: 0 0 6px;
  letter-spacing: -0.005em;
}
.shp-empty__body {
  font-size: 12.5px;
  color: var(--text-secondary);
  max-width: 380px;
  margin: 0 auto;
  line-height: 1.5;
}
.shp-empty__icon {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  margin-bottom: 12px;
}

/* ===== Toolbars / banner row above tables ===== */
.shp-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.shp-toolbar__banner {
  flex: 1;
  font-size: 12.5px;
  color: var(--text-secondary);
}
.shp-toolbar__banner b {
  color: var(--text);
  font-weight: 600;
}
.shp-toolbar__banner code {
  font-family: 'IBM Plex Mono', monospace;
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11.5px;
  margin-right: 4px;
}

/* ===== Logs view ===== */
.shp-logs-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.shp-logs-controls .shp-select { width: auto; min-width: 0; padding-right: 26px; }
.shp-logs-controls .shp-input { width: 200px; }

.shp-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 6px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  background: var(--surface);
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  height: 28px;
  font-weight: 500;
}
.shp-toggle__sw {
  width: 22px; height: 12px;
  background: var(--border-strong);
  border-radius: 8px;
  position: relative;
  flex-shrink: 0;
}
.shp-toggle__sw::after {
  content: ""; width: 8px; height: 8px;
  background: var(--surface);
  border-radius: 50%;
  position: absolute;
  top: 2px; left: 2px;
  transition: left 0.15s ease;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
}
.shp-toggle[data-on="true"] .shp-toggle__sw { background: var(--accent); }
.shp-toggle[data-on="true"] .shp-toggle__sw::after { left: 12px; }

.shp-logs-table {
  font-size: 12px;
  font-family: 'IBM Plex Mono', monospace;
}
.shp-logs-table thead th {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 11px;
}
.shp-logs-table .col-time { width: 90px; color: var(--text-muted); }
.shp-logs-table .col-level { width: 60px; }
.shp-level-pill {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 1px 6px;
  border-radius: 2px;
  border: 1px solid var(--border);
  background: var(--surface-sunken);
  color: var(--text-secondary);
  line-height: 1.4;
}
.shp-level-pill[data-level="info"]  { color: var(--accent);  background: var(--accent-soft);  border-color: var(--accent-border); }
.shp-level-pill[data-level="warn"]  { color: var(--warning); background: var(--warning-soft); border-color: var(--warning-border); }
.shp-level-pill[data-level="error"] { color: var(--danger);  background: var(--danger-soft);  border-color: var(--danger-border); }
.shp-level-pill[data-level="debug"] { color: var(--text-muted); }

.shp-logs-table tr[data-selected="true"] + tr.shp-logs-table__detail {
  display: table-row;
}
.shp-logs-detail {
  background: var(--surface-strip);
  border-top: 1px solid var(--border);
}
.shp-logs-detail td {
  padding: 10px 14px 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
}
.shp-kv {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 3px 16px;
}
.shp-kv dt { color: var(--text-muted); }
.shp-kv dd { margin: 0; color: var(--text); }

.shp-mono-view {
  background: #1A1916;
  color: #E7E3D6;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  line-height: 1.55;
  padding: 12px 14px;
  border-radius: 4px;
  border: 1px solid var(--border-strong);
  overflow: auto;
  white-space: pre;
  height: 320px;
}
.shp-mono-view .ln-time { color: #9C988A; }
.shp-mono-view .ln-err { color: #E58879; }
.shp-mono-view .ln-warn { color: #E3C067; }
.shp-mono-view .ln-info { color: #8FB3E8; }

/* ===== Modal overlays for dialogs (for Config screens) ===== */
.shp-modal-scrim {
  position: absolute;
  inset: 0;
  background: rgba(26,25,22,0.32);
  backdrop-filter: blur(0.5px);
  display: grid;
  place-items: center;
  z-index: 40;
}
.shp-modal {
  width: 420px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  box-shadow: var(--shadow-popover);
  overflow: hidden;
}
.shp-modal__head {
  padding: 12px 16px 8px;
  border-bottom: 1px solid var(--border);
}
.shp-modal__title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.005em;
  margin: 0 0 2px;
}
.shp-modal__sub {
  font-size: 11.5px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
}
.shp-modal__body {
  padding: 14px 16px;
  font-size: 12.5px;
  color: var(--text-secondary);
  line-height: 1.55;
}
.shp-modal__body code {
  font-family: 'IBM Plex Mono', monospace;
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  padding: 1px 5px;
  border-radius: 2px;
}
.shp-modal__foot {
  padding: 10px 16px;
  background: var(--surface-strip);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* ===== Sidebar artboard labels look ===== */
.dc-artboard__label-text {
  font-family: 'IBM Plex Sans', system-ui, sans-serif !important;
}

/* ===== Page-level chrome around artboards ===== */
.section-title {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}

/* misc */
.shp-row { display: flex; align-items: center; gap: 8px; }
.shp-gap { flex: 1; }
.shp-muted { color: var(--text-muted); }
.shp-mono { font-family: 'IBM Plex Mono', monospace; }
.shp-strong { color: var(--text); font-weight: 600; }

/* ===== Flasher-specific styles — extends SerialHop tokens ===== */

/* Browser window chrome */
.fl-window {
  width: 1280px;
  height: 820px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  color: var(--text);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  position: relative;
  box-shadow: 0 1px 0 rgba(26,25,22,0.04), 0 4px 12px -2px rgba(26,25,22,0.08);
}
.fl-chrome {
  height: 38px;
  background: var(--surface-sunken);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 12px;
  flex: 0 0 auto;
  user-select: none;
}
.fl-traffic { display: flex; gap: 6px; }
.fl-traffic i {
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--border-strong);
  display: block;
}
.fl-traffic i:nth-child(1) { background: #E5594D; }
.fl-traffic i:nth-child(2) { background: #DFA64F; }
.fl-traffic i:nth-child(3) { background: #54BD4A; }
.fl-addr {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0 10px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--text-secondary);
  max-width: 460px;
  margin: 0 auto;
}
.fl-addr__lock { color: var(--text-muted); font-size: 10px; }
.fl-addr__path { color: var(--text); }
.fl-chrome__user {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-left: auto;
}
.fl-avatar {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid; place-items: center;
  font-size: 10.5px;
  font-weight: 600;
  border: 1px solid var(--accent-border);
}

/* Header bar (logo + tabs) */
.fl-topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: stretch;
  gap: 32px;
  flex: 0 0 auto;
}
.fl-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 0 13px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
}
.fl-brand__mark {
  width: 22px; height: 22px;
  background: var(--accent);
  border-radius: 4px;
  display: grid; place-items: center;
  color: #fff;
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}
.fl-brand__chip {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  padding: 1px 5px;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  color: var(--text-muted);
  background: var(--surface-sunken);
  font-weight: 500;
  letter-spacing: 0.01em;
  margin-left: 2px;
}
.fl-topbar__tabs {
  display: flex;
  gap: 2px;
  align-items: stretch;
}
.fl-tab {
  background: transparent;
  border: none;
  font: inherit;
  color: var(--text-secondary);
  padding: 14px 14px 13px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  letter-spacing: -0.002em;
}
.fl-tab[data-active="true"] {
  color: var(--text);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.fl-tab__count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  padding: 0 5px;
  border-radius: 8px;
  min-width: 18px;
  text-align: center;
}
.fl-tab[data-active="true"] .fl-tab__count {
  color: var(--accent);
  border-color: var(--accent-border);
  background: var(--accent-soft);
}
/* Dark mode: dim the tab badges — the light-blue accent reads too hot against
   the surrounding muted chrome. Keep the active badge legibly different from
   the inactive ones by leaning on weight + a slightly stronger border. */
[data-theme="dark"] .fl-tab__count {
  color: var(--text-muted);
  background: transparent;
  border-color: var(--border);
}
[data-theme="dark"] .fl-tab[data-active="true"] .fl-tab__count {
  color: var(--text-secondary);
  background: var(--surface-sunken);
  border-color: var(--border-strong);
  font-weight: 600;
}
.fl-topbar__right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11.5px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
}
.fl-topbar__health {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.fl-topbar__health i {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 2px var(--success-soft);
}
.fl-topbar__health[data-tone="warn"] i { background: var(--warning); box-shadow: 0 0 0 2px var(--warning-soft); }
.fl-topbar__health[data-tone="busy"] i { background: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); animation: fl-pulse 1.6s ease-in-out infinite; }
@keyframes fl-pulse { 50% { opacity: 0.5; } }

/* Page body */
.fl-body {
  flex: 1 1 auto;
  overflow: hidden;
  background: var(--bg-page);
  position: relative;
  display: flex;
  flex-direction: column;
}
.fl-page {
  padding: 20px 24px 24px;
  flex: 1 1 auto;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.fl-page__head {
  display: flex;
  align-items: flex-end;
  gap: 16px;
}
.fl-page__title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.018em;
  color: var(--text);
  margin: 0;
}
.fl-page__sub {
  font-size: 12.5px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  margin-bottom: 4px;
}
.fl-page__actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}

/* Flash tab: 2-col layout */
.fl-flash {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 460px;
  gap: 16px;
  align-items: start;
}
.fl-flash__col {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Numbered step section */
.fl-step {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  /* overflow: visible so absolute-positioned dropdown panels inside the
     step body can escape the section's rounded border. Inner tables that
     touch the rounded corners don't actually overflow since they're flush
     to the section's inner padding. */
}
.fl-step[data-disabled="true"] { opacity: 0.55; pointer-events: none; }
.fl-step[data-disabled="true"] .fl-step__num { background: var(--border); color: var(--text-muted); }
.fl-step__head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px 9px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-strip);
}
.fl-step__num {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.fl-step[data-state="done"] .fl-step__num { background: var(--success); }
.fl-step[data-state="pending"] .fl-step__num { background: var(--border-strong); color: var(--text-secondary); }
.fl-step__title {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--text);
  flex: 1;
}
.fl-step__sub {
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
}
.fl-step__actions { display: flex; gap: 6px; }
.fl-step__body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Segmented control */
.fl-seg {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  background: var(--surface-sunken);
  padding: 1px;
  gap: 2px;
  height: 24px;
}
.fl-seg__btn {
  appearance: none;
  font: inherit;
  font-size: 11.5px;
  font-weight: 500;
  padding: 0 10px;
  border-radius: 2px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  letter-spacing: -0.002em;
  height: 100%;
  display: inline-flex;
  align-items: center;
}
.fl-seg__btn[data-active="true"] {
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
}

/* Source picker list */
.fl-srclist {
  border: 1px solid var(--border);
  border-radius: 4px;
  max-height: 280px;
  overflow: auto;
  background: var(--surface);
}
.fl-src {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.fl-src:last-child { border-bottom: none; }
.fl-src:hover { background: var(--surface-strip); }
.fl-src[data-selected="true"] {
  background: var(--accent-soft);
}
.fl-src[data-selected="true"]::before {
  content: "";
  width: 3px;
  align-self: stretch;
  background: var(--accent);
  border-radius: 2px;
  margin: -10px 0 -10px -12px;
}
.fl-src__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fl-src__name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
}
.fl-src__tags { display: flex; gap: 4px; flex-wrap: wrap; }
.fl-src__meta {
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
}
.fl-src__meta b { color: var(--text-secondary); font-weight: 500; }

/* Tag chip */
.fl-tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  font-weight: 500;
  padding: 1px 7px;
  border-radius: 9px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-secondary);
  letter-spacing: 0;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  line-height: 1.5;
}
.fl-tag[data-selected="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.fl-tag[data-tone="prod"] {
  border-color: oklch(0.55 0.13 145 / 0.4);
  background: oklch(0.96 0.03 145);
  color: oklch(0.38 0.13 145);
}
.fl-tag[data-tone="exp"] {
  border-color: oklch(0.55 0.13 70 / 0.4);
  background: oklch(0.96 0.04 70);
  color: oklch(0.4 0.13 70);
}
.fl-tag[data-tone="beta"] {
  border-color: oklch(0.55 0.13 300 / 0.4);
  background: oklch(0.96 0.03 300);
  color: oklch(0.4 0.13 300);
}
.fl-tag__x { color: inherit; opacity: 0.6; font-weight: 600; }
.fl-tag__x:hover { opacity: 1; }

/* Hex input */
.fl-hex {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.fl-hex__row {
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr);
  gap: 10px;
  align-items: baseline;
}
.fl-hex__label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  font-family: 'IBM Plex Mono', monospace;
}
.fl-hex__input {
  appearance: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  padding: 6px 10px;
  border-radius: 3px;
  border: 1px solid var(--border-input);
  background: var(--surface);
  color: var(--text);
  height: 28px;
  letter-spacing: 0.04em;
  width: 100%;
}
.fl-hex__input[data-error="true"] {
  border-color: var(--danger);
  background: var(--danger-soft);
}
.fl-hex__meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  margin-top: -1px;
}
.fl-hex__meta b { color: var(--text-secondary); font-weight: 500; }
.fl-hex__meta--err { color: var(--danger); }

/* Toggle row inside step head (label + switch) */
.fl-toggle-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.fl-switch {
  width: 28px; height: 16px;
  background: var(--border-strong);
  border-radius: 10px;
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s ease;
}
.fl-switch::after {
  content: ""; width: 12px; height: 12px;
  background: var(--surface);
  border-radius: 50%;
  position: absolute;
  top: 2px; left: 2px;
  transition: left 0.15s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,0.18);
}
.fl-switch[data-on="true"] { background: var(--accent); }
.fl-switch[data-on="true"]::after { left: 14px; }

/* Indeterminate progress bar */
.fl-progress {
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  overflow: hidden;
  position: relative;
}
.fl-progress::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, var(--accent) 30%, var(--accent) 70%, transparent 100%);
  width: 40%;
  animation: fl-progress 1.2s linear infinite;
}
@keyframes fl-progress {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

/* Output panel (right side of Flash tab) */
.fl-output {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  overflow: hidden;
  position: sticky;
  top: 0;
}
.fl-output__head {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-strip);
  display: flex;
  align-items: center;
  gap: 10px;
}
.fl-output__title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-secondary);
}
.fl-output__body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.fl-output__empty {
  padding: 40px 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: 12.5px;
  font-family: 'IBM Plex Mono', monospace;
  line-height: 1.6;
}
.fl-output__empty-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--surface-strip);
  border: 1px solid var(--border);
  color: var(--text-muted);
  margin: 0 auto 14px;
}

/* Outcome badge */
.fl-outcome {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 6px 10px;
  border-radius: 4px;
  border: 1px solid;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.003em;
}
.fl-outcome__dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.fl-outcome[data-tone="green"] {
  background: var(--success-soft);
  border-color: var(--success-border);
  color: var(--success);
}
.fl-outcome[data-tone="green"] .fl-outcome__dot { background: var(--success); }
.fl-outcome[data-tone="amber"] {
  background: var(--warning-soft);
  border-color: var(--warning-border);
  color: var(--warning);
}
.fl-outcome[data-tone="amber"] .fl-outcome__dot { background: var(--warning); }
.fl-outcome[data-tone="red"] {
  background: var(--danger-soft);
  border-color: var(--danger-border);
  color: var(--danger);
}
.fl-outcome[data-tone="red"] .fl-outcome__dot { background: var(--danger); }
.fl-outcome[data-tone="blue"] {
  background: var(--accent-soft);
  border-color: var(--accent-border);
  color: var(--accent);
}
.fl-outcome[data-tone="blue"] .fl-outcome__dot { background: var(--accent); animation: fl-pulse 1.6s ease-in-out infinite; }

/* Definition list (meta grid) */
.fl-dl {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 3px 12px;
  font-size: 12px;
  font-family: 'IBM Plex Mono', monospace;
}
.fl-dl dt { color: var(--text-muted); }
.fl-dl dd { margin: 0; color: var(--text); word-break: break-word; }
.fl-dl dd a { color: var(--accent); text-decoration: none; }
.fl-dl dd a:hover { text-decoration: underline; }

/* Stage strip */
.fl-stage {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.fl-stage__chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--surface-sunken);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.fl-stage__chip::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--neutral-dot);
  flex-shrink: 0;
}
.fl-stage__chip[data-state="ok"] {
  background: var(--success-soft);
  border-color: var(--success-border);
  color: var(--success);
}
.fl-stage__chip[data-state="ok"]::before { background: var(--success); }
.fl-stage__chip[data-state="failed"] {
  background: var(--danger-soft);
  border-color: var(--danger-border);
  color: var(--danger);
}
.fl-stage__chip[data-state="failed"]::before { background: var(--danger); }
.fl-stage__chip[data-state="skipped"] {
  background: var(--surface);
  border-color: var(--border);
  color: var(--text-muted);
  border-style: dashed;
}
.fl-stage__chip[data-state="skipped"]::before { background: var(--text-muted); opacity: 0.5; }
.fl-stage__chip[data-state="na"] {
  background: var(--surface);
  border-color: var(--border);
  color: var(--text-muted);
  opacity: 0.45;
}
.fl-stage__chip[data-state="na"]::before { background: var(--neutral-dot); opacity: 0.4; }
.fl-stage__chip[data-state="active"] {
  background: var(--accent-soft);
  border-color: var(--accent-border);
  color: var(--accent);
}
.fl-stage__chip[data-state="active"]::before { background: var(--accent); animation: fl-pulse 1.2s ease-in-out infinite; }

/* Collapsible (raw JSON) */
.fl-details {
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-sunken);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
}
.fl-details > summary {
  padding: 7px 12px;
  cursor: pointer;
  font-weight: 500;
  color: var(--text-secondary);
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.fl-details > summary::before {
  content: "▸";
  font-size: 9px;
  color: var(--text-muted);
  transition: transform 0.15s;
}
.fl-details[open] > summary::before { transform: rotate(90deg); }
.fl-details > pre {
  margin: 0;
  padding: 0 12px 10px 22px;
  font-size: 11px;
  color: var(--text);
  white-space: pre;
  overflow: auto;
  max-height: 180px;
  line-height: 1.5;
}
.fl-json-k { color: var(--accent); }
.fl-json-s { color: var(--success); }
.fl-json-n { color: #B23A8C; }
.fl-json-b { color: var(--warning); }

/* Hex diff */
.fl-diff {
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  background: var(--surface);
}
.fl-diff__row {
  display: grid;
  grid-template-columns: 78px 1fr;
  gap: 0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
}
.fl-diff__row:last-of-type { border-bottom: none; }
.fl-diff__lbl {
  background: var(--surface-strip);
  padding: 7px 10px;
  color: var(--text-muted);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  border-right: 1px solid var(--border);
  display: flex;
  align-items: center;
}
.fl-diff__bytes {
  padding: 7px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 3px 6px;
  align-items: center;
}
.fl-diff__byte {
  display: inline-block;
  padding: 0 1px;
  border-radius: 2px;
}
.fl-diff__byte[data-diff="true"] {
  background: var(--danger-soft);
  color: var(--danger);
  font-weight: 600;
  padding: 0 4px;
  border: 1px solid var(--danger-border);
  margin: -1px 0;
}
.fl-diff__foot {
  padding: 6px 12px;
  background: var(--surface-sunken);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-secondary);
  font-family: 'IBM Plex Mono', monospace;
  display: flex;
  justify-content: space-between;
}
.fl-diff__foot--err { color: var(--danger); }

/* Stats card */
.fl-stats {
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-strip);
  padding: 8px 12px;
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.fl-stat__lbl {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}
.fl-stat__val {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.012em;
  color: var(--text);
  font-feature-settings: "tnum" 1;
  font-family: 'IBM Plex Mono', monospace;
}
.fl-stat__val[data-tone="green"] { color: var(--success); }
.fl-stat__val[data-tone="red"] { color: var(--danger); }
.fl-stat__val[data-tone="amber"] { color: var(--warning); }
.fl-stat__sub {
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  margin-left: auto;
}

/* Two-pane (Firmware / Backups list + detail) */
.fl-twopane {
  display: grid;
  grid-template-columns: 460px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
  min-height: 0;
}
.fl-pane {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.fl-pane__head {
  padding: 10px 12px 9px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-strip);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.fl-pane__searchrow {
  display: flex;
  gap: 6px;
  align-items: center;
}
.fl-pane__searchrow .shp-input { flex: 1; }
.fl-pane__tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

/* Row inside list pane */
.fl-row {
  padding: 10px 12px 11px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: start;
  cursor: pointer;
  position: relative;
}
.fl-row:last-child { border-bottom: none; }
.fl-row:hover { background: var(--surface-strip); }
.fl-row[data-selected="true"] {
  background: var(--accent-soft);
}
.fl-row[data-selected="true"]::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--accent);
}
.fl-row__check {
  margin-top: 2px;
}
.fl-row__main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fl-row__name {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
}
.fl-row__tags { display: flex; gap: 4px; flex-wrap: wrap; }
.fl-row__meta {
  font-size: 10.5px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.01em;
}
.fl-row__meta b { color: var(--text-secondary); font-weight: 500; }
.fl-row__actions {
  display: flex;
  gap: 4px;
  align-items: center;
}

/* Detail pane content */
.fl-detail__head {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
}
.fl-detail__h {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.015em;
  margin: 0 0 4px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
}
.fl-detail__sub {
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  word-break: break-all;
}
.fl-detail__body {
  padding: 14px 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow: auto;
}

/* Sub-heading inside detail */
.fl-dh {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-muted);
  margin: 0 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.fl-dh::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Flash history line */
.fl-hist {
  display: grid;
  grid-template-columns: 132px 110px 1fr auto auto;
  gap: 12px;
  padding: 6px 10px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  cursor: pointer;
}
.fl-hist:last-child { border-bottom: none; }
.fl-hist:hover { background: var(--surface-strip); }
.fl-hist__time { color: var(--text-muted); }
.fl-hist__src { color: var(--text); }
.fl-hist__dur { color: var(--text-muted); }

/* Side drawer (Log detail) */
.fl-drawer-scrim {
  position: absolute;
  inset: 0;
  background: rgba(26,25,22,0.18);
  z-index: 50;
  display: flex;
  justify-content: flex-end;
}
.fl-drawer {
  width: 620px;
  background: var(--surface);
  border-left: 1px solid var(--border-strong);
  box-shadow: -8px 0 24px -8px rgba(26,25,22,0.18);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.fl-drawer__head {
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-strip);
  display: flex;
  align-items: center;
  gap: 12px;
}
.fl-drawer__title {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
  font-family: 'IBM Plex Mono', monospace;
}
.fl-drawer__close {
  margin-left: auto;
  width: 26px; height: 26px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface);
  display: grid; place-items: center;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 13px;
}
.fl-drawer__close:hover { background: var(--surface-sunken); color: var(--text); }
.fl-drawer__body {
  flex: 1 1 auto;
  overflow: auto;
  padding: 16px 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Filter panel for logs */
.fl-filters {
  border: 1px solid var(--border);
  background: var(--surface-strip);
  border-radius: 6px;
  padding: 10px 14px 12px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px 20px;
  align-items: start;
  position: relative;
}
.fl-filters__head {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
  margin-bottom: 2px;
}
.fl-filters__title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
}
.fl-filt {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  /* Subtle divider between columns to define grouping */
  padding-right: 18px;
  border-right: 1px solid var(--border);
}
.fl-filt:last-of-type { border-right: 0; padding-right: 0; }
.fl-filt__lbl {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-bottom: 2px;
}
.fl-filt__checks {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.fl-filt__date-row {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr);
  gap: 6px;
  align-items: center;
}
.fl-filt__date-row .shp-input,
.fl-filt__date-row .fl-date { padding: 4px 8px; height: 26px; font-size: 11.5px; }
.fl-filt__date-row > span:first-child {
  color: var(--text-muted);
  font-size: 10.5px;
  font-family: 'IBM Plex Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.fl-filt__clear {
  appearance: none;
  background: var(--surface);
  color: var(--text-secondary);
  font: inherit;
  font-size: 11px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-weight: 500;
  letter-spacing: -0.002em;
  cursor: pointer;
  padding: 3px 9px;
  height: 22px;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.fl-filt__clear::before {
  content: "×";
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  line-height: 1;
  margin-top: -1px;
}
.fl-filt__clear:hover {
  background: var(--surface-sunken);
  border-color: var(--text-muted);
  color: var(--text);
}
.fl-filt__clear:hover::before { color: var(--danger); }

/* Logs results table */
.fl-logs-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11.5px;
  background: var(--surface);
}
.fl-logs-table thead th {
  background: var(--surface-strip);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.fl-logs-table tbody td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--text);
  white-space: nowrap;
  vertical-align: middle;
}
.fl-logs-table tbody tr { cursor: pointer; }
.fl-logs-table tbody tr:hover { background: var(--surface-strip); }
.fl-logs-table tbody tr[data-selected="true"] { background: var(--accent-soft); }
.fl-logs-table tbody tr[data-selected="true"] td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.fl-logs-table .col-time { color: var(--text-muted); width: 152px; }
.fl-logs-table .col-client { width: 88px; }
.fl-logs-table .col-port { width: 108px; }
.fl-logs-table .col-dur { width: 60px; color: var(--text-muted); text-align: right; }
.fl-logs-table .col-note { color: var(--text-muted); font-family: 'IBM Plex Sans', system-ui, sans-serif; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }

/* Outcome pill (compact, for tables) */
.fl-outc {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 1px 7px 1px 6px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface-sunken);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0;
}
.fl-outc::before {
  content: "";
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--neutral-dot);
}
.fl-outc[data-tone="green"] { background: var(--success-soft); border-color: var(--success-border); color: var(--success); }
.fl-outc[data-tone="green"]::before { background: var(--success); }
.fl-outc[data-tone="amber"] { background: var(--warning-soft); border-color: var(--warning-border); color: var(--warning); }
.fl-outc[data-tone="amber"]::before { background: var(--warning); }
.fl-outc[data-tone="red"] { background: var(--danger-soft); border-color: var(--danger-border); color: var(--danger); }
.fl-outc[data-tone="red"]::before { background: var(--danger); }
.fl-outc[data-tone="blue"] { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
.fl-outc[data-tone="blue"]::before { background: var(--accent); animation: fl-pulse 1.2s ease-in-out infinite; }

/* Big primary submit */
.fl-submit-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}
.fl-submit-bar__msg {
  flex: 1;
  font-size: 12px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
}
.fl-submit-bar__msg b { color: var(--text-secondary); font-weight: 500; }
.fl-submit-bar .shp-btn--primary {
  height: 36px;
  font-size: 13px;
  padding: 0 18px;
  font-weight: 600;
}

/* Banner inside output area for "another flash running" */
.fl-banner {
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 11.5px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
}
.fl-banner b { color: var(--accent); }

/* Error block */
.fl-errblock {
  background: var(--danger-soft);
  border: 1px solid var(--danger-border);
  border-radius: 4px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.fl-errblock__code {
