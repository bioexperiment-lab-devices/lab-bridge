# Single source of truth for stack pins and infrastructure paths.
# Read by both `task deploy` (laptop) and CI's release-build job.
# Renovate-managed; bump via PR.

jupyter_image: quay.io/jupyter/scipy-notebook:2026-04-20
chisel_image: jpillora/chisel:1.10.1
chisel_listen_port: 7000
loki_image: grafana/loki:3.2.1
loki_retention_days: 30
grafana_image: grafana/grafana:11.3.0

# Prometheus host-monitoring stack. All vendor-neutral; no metadata-service
# dependency. Renovate-managed.
prometheus_image: prom/prometheus:v3.0.1
node_exporter_image: quay.io/prometheus/node-exporter:v1.8.2
cadvisor_image: gcr.io/cadvisor/cadvisor:v0.49.1

# Prometheus TSDB retention. Mirrors loki_retention_days for symmetry between
# logs and metrics history (see compose/pins.yaml:loki_retention_days).
prometheus_retention_days: 30

# GHCR repository for the siteapp image. The image *tag* lives in
# the root VERSION (release-please-managed); the full reference is
# "${siteapp_image_repo}:$(cat VERSION)".
siteapp_image_repo: ghcr.io/bioexperiment-lab-devices/lab-bridge-siteapp

# GHCR repository for the flasher image. The image *tag* lives in
# the root VERSION (release-please-managed); the full reference is
# "${flasher_image_repo}:$(cat VERSION)".
flasher_image_repo: ghcr.io/bioexperiment-lab-devices/lab-bridge-flasher

# GHCR repository for the custom Caddy image (carries the replace-response
# plugin used for the platform navbar injection). The image *tag* lives in
# the root VERSION (release-please-managed); the full reference is
# "${caddy_image_repo}:$(cat VERSION)".
caddy_image_repo: ghcr.io/bioexperiment-lab-devices/lab-bridge-caddy

acme_email: khamitov.personal@gmail.com
remote_root: /srv/lab-bridge
notebooks_path: /srv/jupyterlab/work
ssh_port: 22
