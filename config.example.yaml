# config.example.yaml — copy to config.yaml and fill in.
# config.yaml is gitignored; never commit secrets.
#
# Stack-level pins live in two tracked, PR-reviewable, Renovate-managed
# files: paths, retention, ports, and ACME email in compose/pins.yaml;
# externally-released image tags in compose/images.yaml.
# This file carries only instance-specific values + secrets + the chisel
# client roster.

vps_public_ip: 0.0.0.0           # public IPv4 passed to the streamer (WebRTC ICE candidate)

vps:
  host: 0.0.0.0                  # public IPv4 of the VPS
  ssh_user: khamit               # must already exist with passwordless sudo

jupyter:
  # Deprecated: Authelia gates Jupyter via Caddy forward_auth. The notebook
  # itself runs token-less inside the labnet. This field is ignored at deploy
  # time and will be removed in the release after this one.
  password_hash: ""

# Lab devices that connect inbound via chisel. Manage via `task secrets:add-client`.
# Each `reverse_port` is reachable inside the docker network as `chisel:<port>`,
# never published to the host. Each device's chisel credential is restricted to
# only its own port.
chisel_clients: []
# Example shape:
# chisel_clients:
#   - name: microscope-1
#     reverse_port: 9001
#     password: "32-char-random"

# Optional-service selection. Services listed here are omitted from the
# deploy entirely: no container, no Caddy route (path → styled 404), no
# navbar entry, no healthcheck probe. Absent key or [] = full stack.
# Allowed names: jupyter, monitoring, studio, streamer, flasher
#   - monitoring = grafana + loki + prometheus + node-exporter + cadvisor
#     (disabling it also drops chisel-client log shipping to Loki)
# Core services (caddy, authelia, siteapp, chisel) cannot be disabled.
# Data dirs (grafana_data/, flasher_data/, …) are preserved on the VPS —
# re-enabling a service restores its state.
# NOTE: if this instance is also the CI deploy target, mirror this list in
# the LDS_DISABLED_SERVICES GitHub Actions variable (dual-managed, like
# secrets) or the next release will re-enable the services.
disabled_services: []
