# config.example.yaml — copy to config.yaml and fill in.
# config.yaml is gitignored; never commit secrets.
#
# Stack-level pins (image tags, paths, retention, ports, ACME email) live
# in compose/pins.yaml — tracked in git, PR-reviewable, Renovate-managed.
# This file carries only instance-specific values + secrets + the chisel
# client roster.

vps:
  host: 0.0.0.0                  # public IPv4 of the VPS
  ssh_user: khamit               # must already exist with passwordless sudo

jupyter:
  # Shared password (sha1:salt:digest). Set with `task secrets:set-jupyter-password`.
  password_hash: "<run task secrets:set-jupyter-password>"

siteapp:
  # bcrypt hash for the operator-gated /flash/* UI — set via `task secrets:set-admin-password`.
  admin_password_hash: "<run task secrets:set-admin-password>"

# Lab devices that connect inbound via chisel. Manage via `task secrets:add-client`.
# Each `reverse_port` is reachable inside the docker network as `chisel:<port>`,
# never published to the host. Each device's chisel credential is restricted to
# only its own port.
chisel_clients: []
# Example shape:
# chisel_clients:
#   - name: microscope-1
#     reverse_port: 9001
#     password: "32-char-random"

# Yandex Cloud monitoring (optional; omit to disable host metrics).
# When set, the deploy renders the unified-agent service block into
# docker-compose. Auth uses the VM-attached service account (cloud_meta);
# no key file lives here. The VM must have a SA with monitoring.editor
# attached at the infra level — see README "First-time setup: host monitoring".
# yc:
#   folder_id: b1g00000000000000000
