version: '3'

vars:
  CONFIG: config.yaml

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  doctor:
    desc: Verify local prerequisites are installed
    cmds:
      - bash scripts/doctor.sh

  test:
    desc: Run all bats tests (requires bats-core; integration tests need Docker)
    cmd: bats tests/integration/

  # --- Lifecycle ---
  provision:
    desc: First-time VPS setup (Docker, ufw, dirs). Idempotent.
    cmd: bash scripts/provision.sh
  deploy:
    desc: Render configs and bring up the stack on the VPS
    cmd: LDS_SKIP_PUBLIC_DOCS=1 bash scripts/deploy.sh
  "deploy:rollback":
    desc: Trigger a CI rollback to a prior tag (e.g. task deploy:rollback -- v0.4.1)
    cmd: gh workflow run release-please.yml -f rollback_to={{.CLI_ARGS}}
  "images:bump":
    desc: "Bump an external image pin and open a releasable PR (e.g. task images:bump -- studio 0.9.0)"
    cmd: bash scripts/images.sh bump {{.CLI_ARGS}}
  "images:ship":
    desc: "Cut a release for image pins already merged to main (e.g. Renovate chore bumps)"
    cmd: bash scripts/images.sh ship {{.CLI_ARGS}}
  restart:  { desc: "docker compose restart",                        cmd: "bash scripts/ops.sh restart" }
  down:     { desc: "docker compose down",                           cmd: "bash scripts/ops.sh down" }
  destroy:  { desc: "docker compose down -v (DANGEROUS)",            cmd: "bash scripts/ops.sh destroy" }

  # --- Secrets ---
  "secrets:set-jupyter-password":
    desc: Set or rotate the shared JupyterLab password (prompts; deploy to apply)
    cmd: bash scripts/secrets.sh set-jupyter-password
  "secrets:set-grafana-password":
    desc: Set or rotate the Grafana admin password (prompts; deploy to apply)
    cmd: bash scripts/secrets.sh set-grafana-password
  "secrets:rotate-agent-upload-token":
    desc: Generate a new CI agent upload token (deploy to apply; old token stops working)
    cmd: bash scripts/secrets.sh rotate-agent-upload-token
  "secrets:rotate-flasher-upload-token":
    desc: Generate a new bearer token for the flasher upload API; mirrors to GH repo secret
    cmd: bash scripts/secrets.sh rotate-flasher-upload-token
  "secrets:add-client":
    desc: Add a chisel client (lab device); generates a random password
    cmd: bash scripts/secrets.sh add-client {{.CLI_ARGS}}
  "secrets:show-client":
    desc: Re-print chisel client invocation for an existing device
    cmd: bash scripts/secrets.sh show-client {{.CLI_ARGS}}
  "secrets:rm-client":
    desc: Remove a chisel client
    cmd: bash scripts/secrets.sh rm-client {{.CLI_ARGS}}
  "secrets:bootstrap-authelia":
    desc: Generate Authelia secrets (JWT, session, storage encryption, OIDC HMAC, RSA JWKS key) and the Grafana OIDC client secret + its PBKDF2 hash. Pass --rotate to overwrite.
    cmd: bash scripts/secrets.sh bootstrap-authelia {{.CLI_ARGS}}

  # --- Users (Authelia identities) ---
  "users:add":
    desc: "Add a user (prompts for password). Usage: task users:add -- USER GROUP[,GROUP]"
    cmd: bash scripts/users.sh add {{.CLI_ARGS}}
  "users:rm":
    desc: "Remove a user. Usage: task users:rm -- USER"
    cmd: bash scripts/users.sh rm {{.CLI_ARGS}}
  "users:set-password":
    desc: "Set a new password for a user (prompts). Usage: task users:set-password -- USER"
    cmd: bash scripts/users.sh set-password {{.CLI_ARGS}}
  "users:set-groups":
    desc: "Set the group list for a user. Usage: task users:set-groups -- USER GROUP[,GROUP]"
    cmd: bash scripts/users.sh set-groups {{.CLI_ARGS}}
  "users:list":
    desc: Print all users with their groups
    cmd: bash scripts/users.sh list

  # --- Operations ---
  logs:     { desc: "Show recent logs (optionally for a single service)", cmd: "bash scripts/ops.sh logs {{.CLI_ARGS}}" }
  ps:       { desc: "docker compose ps on the VPS",                  cmd: "bash scripts/ops.sh ps" }
  ssh:      { desc: "Open an interactive SSH session to the VPS",    cmd: "bash scripts/ops.sh ssh" }
  backup:   { desc: "rsync notebooks to ./backups/notebooks-<ts>/",  cmd: "bash scripts/ops.sh backup" }
  "ops:logs:loki":
    desc: Tail recent loki container logs
    cmd: bash scripts/ops.sh logs:loki
  "ops:logs:grafana":
    desc: Tail recent grafana container logs
    cmd: bash scripts/ops.sh logs:grafana
  "ops:loki-disk":
    desc: Show loki_data disk usage and configured retention
    cmd: bash scripts/ops.sh loki-disk
  "ops:logs:siteapp":
    desc: Tail recent siteapp container logs
    cmd: bash scripts/ops.sh logs:siteapp
  "ops:site-disk":
    desc: Show site_data/ disk usage (docs/ and agent/)
    cmd: bash scripts/ops.sh site-disk

  # --- Siteapp image ---
  "siteapp:build-and-push":
    desc: Build and push the siteapp image. Reads version from root VERSION; reads SITEAPP_IMAGE_REPO from compose/pins.yaml (or env override).
    cmd: bash services/siteapp/build.sh

  # --- Flasher image ---
  "flasher:build-and-push":
    desc: Build and push the flasher image. Reads version from root VERSION; reads FLASHER_IMAGE_REPO from compose/pins.yaml (or env override).
    cmd: bash services/flasher/build.sh

  "ops:logs:flasher":
    desc: Tail recent flasher container logs
    cmd: bash scripts/ops.sh logs:flasher

  # --- Streamer image ---
  "streamer:build-and-push":
    desc: Build and push the streamer image. Reads version from root VERSION; reads STREAMER_IMAGE_REPO from compose/pins.yaml (or env override).
    cmd: bash services/streamer/build.sh

  "ops:logs:streamer":
    desc: Tail recent streamer container logs
    cmd: bash scripts/ops.sh logs:streamer

  # --- Experiment Studio (external image; pinned in compose/images.yaml) ---
  "ops:logs:studio":
    desc: Tail recent studio container logs
    cmd: bash scripts/ops.sh logs:studio
