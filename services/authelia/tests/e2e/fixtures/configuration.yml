# Test fixture: rendered from config/configuration.yml.tmpl
# __VPS_HOST__ = test.local
# __GRAFANA_OIDC_SECRET_HASH__ = PBKDF2-SHA512 of "grafana-test-secret"

theme: light

server:
  address: tcp://0.0.0.0:9091/

log:
  level: info
  format: text

totp:
  issuer: lab-bridge

authentication_backend:
  password_reset:
    disable: true
  refresh_interval: 30s
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id

access_control:
  default_policy: deny
  rules:
    - domain: test.local
      resources:
        - '^/api/auth/whoami$'
      policy: one_factor
    - domain: test.local
      resources:
        - '^/flash.*'
      policy: one_factor
      subject: 'group:admins'
    - domain: test.local
      resources:
        - '^/api/admin/.*'
      policy: one_factor
      subject: 'group:admins'
    - domain: test.local
      resources:
        - '^/jupyter.*'
      policy: one_factor
      subject:
        - 'group:admins'
        - 'group:researchers'
    - domain: test.local
      resources:
        - '^/grafana/.*'
      policy: one_factor
      subject:
        - 'group:admins'
        - 'group:researchers'

session:
  cookies:
    - domain: test.local
      authelia_url: https://test.local/auth
      default_redirection_url: https://test.local/
      name: authelia_session
      same_site: lax
      expiration: 1h
      inactivity: 5m
      remember_me: 2160h    # 90 days
  # Keep in step with services/authelia/config/configuration.yml.tmpl —
  # test_session_persistence.py depends on sessions living outside the
  # Authelia process.
  redis:
    host: redis
    port: 6379

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  disable_startup_check: true
  filesystem:
    filename: /data/notification.txt

identity_providers:
  oidc:
    # Mirrors the prod template: the OIDC signing key moved to `jwks`, a list,
    # which Authelia's env-var mapping cannot express — so it is read from its
    # mounted secret via the template filter (X_AUTHELIA_CONFIG_FILTERS in
    # compose.yaml).
    jwks:
      - key: |
          {{- secret "/run/secrets/oidc_jwks_key.pem" | nindent 10 }}
    cors:
      endpoints:
        - authorization
        - token
        - revocation
        - introspection
        - userinfo
    clients:
      - client_id: grafana
        client_name: Grafana
        client_secret: '$pbkdf2-sha512$310000$6dRXBdgWEAAM7jMll77TNA$nYmyVgHgaNAudIuHdfXqgmUnx36Eqbx.af2365otaXJrIkimFl5icbCa6jnFIWNWS0VY0nu68rA16rr83lWqug'
        public: false
        authorization_policy: one_factor
        consent_mode: implicit
        redirect_uris:
          - https://test.local/grafana/login/generic_oauth
        scopes:
          - openid
          - profile
          - email
          - groups
          - offline_access
        grant_types:
          - authorization_code
          - refresh_token
        response_types:
          - code
        userinfo_signed_response_alg: none
