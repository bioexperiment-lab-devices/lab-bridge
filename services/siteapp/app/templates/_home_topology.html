<section class="lb-section lb-topo-section" aria-labelledby="lb-topo-title">
  <header class="lb-section__head">
    <h2 id="lb-topo-title" class="lb-section__title">{{ s.topo_title }}</h2>
    <div class="lb-section__rule" aria-hidden="true"></div>
  </header>
  <div class="lb-topo">
    <div class="lb-topo__node">
      <div class="lb-topo__node-ico" aria-hidden="true">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="3.5" width="13" height="9" rx="1"/>
          <path d="M2.5 11h13"/>
          <path d="M6 15h6M7.5 12.5v2.5M10.5 12.5v2.5"/>
        </svg>
      </div>
      <div class="lb-topo__node-body">
        <div class="lb-topo__node-title">{{ s.topo_node_lab }}</div>
        <div class="lb-topo__node-sub">{{ s.topo_node_lab_sub }}</div>
      </div>
    </div>
    <div class="lb-topo__edge" aria-hidden="true">
      <span class="lb-topo__edge-label">{{ s.topo_edge_1 }}</span>
    </div>
    <div class="lb-topo__node lb-topo__node--accent">
      <div class="lb-topo__node-ico" aria-hidden="true">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 11A3 3 0 0 1 6 5.2a4 4 0 0 1 7.7.7A2.8 2.8 0 0 1 14 11"/>
          <path d="M4.5 11h9"/>
          <path d="M6 13.5h6M7.5 16h3"/>
        </svg>
      </div>
      <div class="lb-topo__node-body">
        <div class="lb-topo__node-title">{{ s.topo_node_bridge }}</div>
        <div class="lb-topo__node-sub">{{ s.topo_node_bridge_sub }}</div>
      </div>
    </div>
    <div class="lb-topo__edge" aria-hidden="true">
      <span class="lb-topo__edge-label">{{ s.topo_edge_2 }}</span>
    </div>
    <div class="lb-topo__node">
      <div class="lb-topo__node-ico" aria-hidden="true">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="3.5" width="13" height="9" rx="1"/>
          <path d="M2.5 6h13"/>
          <circle cx="4.5" cy="4.75" r="0.4" fill="currentColor"/>
          <circle cx="6.0" cy="4.75" r="0.4" fill="currentColor"/>
          <path d="M5 9l1.5 1.5L5 12M8 12h3.5"/>
          <path d="M6 15h6"/>
        </svg>
      </div>
      <div class="lb-topo__node-body">
        <div class="lb-topo__node-title">{{ s.topo_node_researcher }}</div>
        <div class="lb-topo__node-sub">{{ s.topo_node_researcher_sub }}</div>
      </div>
    </div>
  </div>
</section>
