{% extends "base.html" %}
{% block title %}Sign in — lab-bridge{% endblock %}
{% block main %}
  <section class="lb-login-page">
    <div class="lb-login">
      <form id="login-form" class="lb-login__card" novalidate>
        <h1 class="lb-login__title">Sign in to lab-bridge</h1>

        <div class="lb-login__error" role="alert" aria-live="assertive" hidden>
          <span class="lb-login__error-mark" aria-hidden="true">!</span>
          <span class="lb-login__error-text"></span>
        </div>

        <div class="lb-field">
          <label class="lb-field__label" for="lb-username">Username</label>
          <input id="lb-username"
                 class="lb-field__input"
                 type="text"
                 name="username"
                 autocomplete="username"
                 spellcheck="false"
                 autocapitalize="off"
                 autofocus
                 required
                 placeholder="e.g. a.volkova">
        </div>

        <div class="lb-field">
          <label class="lb-field__label" for="lb-password">Password</label>
          <div class="lb-field__wrap">
            <input id="lb-password"
                   class="lb-field__input"
                   type="password"
                   name="password"
                   autocomplete="current-password"
                   required
                   placeholder="••••••••">
            <button type="button"
                    class="lb-field__reveal"
                    aria-label="Show password"
                    aria-pressed="false">
              <svg class="lb-field__reveal-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="lb-field__reveal-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                <path d="m2 2 20 20"/>
              </svg>
            </button>
          </div>
        </div>

        <label class="lb-check">
          <input type="checkbox" class="lb-check__input" name="remember" checked>
          <span class="lb-check__box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </span>
          <span class="lb-check__text">
            <span class="lb-check__label">Keep me signed in</span>
            <span class="lb-check__hint">Stay signed in for 90 days on this device.</span>
          </span>
        </label>

        <button type="submit" class="lb-login__submit" disabled>
          <svg class="lb-login__submit-arrow" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
          <span class="lb-login__spinner" aria-hidden="true" hidden></span>
          <span class="lb-login__submit-label">Sign in</span>
        </button>

        <footer class="lb-login__foot">
          <span class="lb-login__foot-lock" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <span>No account? Ask your server administrator — sign-up is not public.</span>
        </footer>
      </form>
    </div>
  </section>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const rd = params.get('rd') || {{ rd|tojson }};
      const form = document.getElementById('login-form');
      const usernameEl = form.querySelector('input[name="username"]');
      const passwordEl = form.querySelector('input[name="password"]');
      const rememberEl = form.querySelector('input[name="remember"]');
      const submitBtn = form.querySelector('.lb-login__submit');
      const submitLabel = submitBtn.querySelector('.lb-login__submit-label');
      const submitArrow = submitBtn.querySelector('.lb-login__submit-arrow');
      const submitSpinner = submitBtn.querySelector('.lb-login__spinner');
      const errBox = form.querySelector('.lb-login__error');
      const errText = errBox.querySelector('.lb-login__error-text');
      const revealBtn = form.querySelector('.lb-field__reveal');
      const revealEye = revealBtn.querySelector('.lb-field__reveal-eye');
      const revealEyeOff = revealBtn.querySelector('.lb-field__reveal-eye-off');

      function refreshSubmitEnabled() {
        const filled = usernameEl.value.trim() && passwordEl.value;
        const loading = form.dataset.loading === 'true';
        submitBtn.disabled = loading || !filled;
      }

      function setLoading(loading) {
        form.dataset.loading = loading ? 'true' : 'false';
        submitArrow.hidden = loading;
        submitSpinner.hidden = !loading;
        submitLabel.textContent = loading ? 'Signing in…' : 'Sign in';
        refreshSubmitEnabled();
      }

      function showError(text) {
        errText.textContent = text;
        errBox.hidden = false;
      }

      function hideError() {
        errBox.hidden = true;
      }

      usernameEl.addEventListener('input', refreshSubmitEnabled);
      passwordEl.addEventListener('input', refreshSubmitEnabled);

      revealBtn.addEventListener('click', () => {
        const showing = passwordEl.type === 'text';
        const next = !showing;
        passwordEl.type = next ? 'text' : 'password';
        revealBtn.setAttribute('aria-pressed', next ? 'true' : 'false');
        revealBtn.setAttribute('aria-label', next ? 'Hide password' : 'Show password');
        // `.hidden = ...` doesn't reflect to the content attribute on SVGElement,
        // so the [hidden] CSS rule never matches. Toggle the attribute directly.
        revealEye.toggleAttribute('hidden', next);
        revealEyeOff.toggleAttribute('hidden', !next);
      });

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        if (submitBtn.disabled) return;
        hideError();
        setLoading(true);
        try {
          const r = await fetch('/api/auth/firstfactor', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: usernameEl.value,
              password: passwordEl.value,
              targetURL: rd,
              keepMeLoggedIn: rememberEl.checked,
            }),
          });
          // Authelia /api/firstfactor returns 200 on success when called
          // server-to-server by siteapp's /api/auth/firstfactor proxy —
          // there is no redirect status to handle in this integration.
          if (r.status === 200) {
            const body = await r.json();
            location.assign(body.redirect || '/');
            return;
          }
          showError(r.status === 401
            ? 'Incorrect username or password.'
            : 'Sign-in failed (' + r.status + ').');
          setLoading(false);
        } catch (e) {
          showError('Network error.');
          setLoading(false);
        }
      });
    })();
  </script>
{% endblock %}
