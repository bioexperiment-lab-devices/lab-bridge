{% extends "base.html" %}
{% block title %}Not found — lab-bridge{% endblock %}
{% block main %}
  <section class="lb-forbidden-page">
    <div class="lb-forbidden">
      <span class="lb-forbidden__code">Error 404 · Not found</span>

      <div class="lb-forbidden__card">
        <div class="lb-forbidden__head">
          <div class="lb-forbidden__lock lb-forbidden__lock--404" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m13.5 8.5-5 5"/>
              <path d="m8.5 8.5 5 5"/>
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
          </div>
          <h1 class="lb-forbidden__title">Page not found</h1>
        </div>
        <p class="lb-forbidden__body">We couldn't find that page. The link may be broken or the resource may have been renamed.</p>

        <dl class="lb-forbidden__meta">
          <div>
            <dt>Attempted path</dt>
            <dd><code>{{ attempted_path }}</code></dd>
          </div>
        </dl>

        <div class="lb-forbidden__actions">
          <button type="button" class="lb-forbidden__primary" onclick="history.back()">
            <span aria-hidden="true">←</span>
            <span>Back</span>
          </button>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
