# Test fixture for siteapp e2e — Authelia config with domain=siteapp
# Derived from services/authelia/tests/e2e/fixtures/configuration.yml
# Changes: test.local → siteapp throughout, default_redirection_url updated.

theme: light
default_redirection_url: https://siteapp.local/

server:
  host: 0.0.0.0
  port: 9091

log:
  level: info
  format: text

totp:
  issuer: lab-bridge

authentication_backend:
  password_reset:
    disable: true
  refresh_interval: 30s
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id

access_control:
  default_policy: deny
  rules:
    - domain: siteapp.local
      resources:
        - '^/flash.*'
      policy: one_factor
      subject: 'group:admins'
    - domain: siteapp.local
      resources:
        - '^/jupyter.*'
      policy: one_factor
      subject:
        - 'group:admins'
        - 'group:researchers'
    - domain: siteapp.local
      resources:
        - '^/grafana/.*'
      policy: one_factor
      subject:
        - 'group:admins'
        - 'group:researchers'

session:
  name: authelia_session
  domain: siteapp.local
  same_site: lax
  expiration: 1h
  inactivity: 5m
  remember_me_duration: 2160h    # 90 days

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  disable_startup_check: true
  filesystem:
    filename: /data/notification.txt

identity_providers:
  oidc:
    cors:
      endpoints:
        - authorization
        - token
        - revocation
        - introspection
        - userinfo
    clients:
      - id: grafana
        description: Grafana
        secret: '$pbkdf2-sha512$310000$6dRXBdgWEAAM7jMll77TNA$nYmyVgHgaNAudIuHdfXqgmUnx36Eqbx.af2365otaXJrIkimFl5icbCa6jnFIWNWS0VY0nu68rA16rr83lWqug'
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - https://siteapp.local/grafana/login/generic_oauth
        scopes:
          - openid
          - profile
          - email
          - groups
        grant_types:
          - authorization_code
          - refresh_token
        response_types:
          - code
        userinfo_signing_algorithm: none
