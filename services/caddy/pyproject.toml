[project]
name = "caddy"
version = "0.1.0"
description = "Custom Caddy build with replace-response plugin."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.29",
    "ruff>=0.6,<0.13",
]

[tool.pytest.ini_options]
addopts = "-q"
# E2E tests have their own setup (docker compose) and are invoked
# explicitly via `pytest tests/e2e/`. Exclude from default collection.
norecursedirs = ["tests/e2e"]

[tool.ruff]
line-length = 100
target-version = "py313"
