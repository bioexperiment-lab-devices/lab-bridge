[project]
name = "streamer"
version = "0.1.0"
description = "Live WebRTC video streaming for lab-bridge."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "httpx>=0.27,<0.29",
    "aiortc>=1.9,<2.0",
    "python-ulid>=2.7,<3.0",
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.6,<0.13",
    "respx>=0.21,<0.22",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
norecursedirs = ["tests/e2e"]
pythonpath = ["tests/e2e"]

[tool.ruff]
line-length = 100
target-version = "py313"
